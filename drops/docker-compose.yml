name: flashmarket-drops

x-drops-runtime: &drops-runtime
  image: flashmarket-drops-api:local
  pull_policy: never
  init: true
  stop_grace_period: 20s
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

x-drops-environment: &drops-environment
  DROPS_ENVIRONMENT: development
  DROPS_DATABASE_URL: postgresql+asyncpg://${INFRA_USER:-shide}:${POSTGRES_PASSWORD:-shide}@shide-postgres:5432/drops
  DROPS_RABBITMQ_URL: amqp://${INFRA_USER:-shide}:${RABBITMQ_PASSWORD:-shide}@shide-rabbitmq:5672/flashmarket
  CELERY_BROKER_URL: amqp://${INFRA_USER:-shide}:${RABBITMQ_PASSWORD:-shide}@shide-rabbitmq:5672/flashmarket-tasks
  DROPS_CORS_ORIGINS: '["http://localhost:3000"]'
  DROPS_TRUSTED_HOSTS: '["localhost","127.0.0.1","drops","gateway"]'
  DROPS_ALLOW_INSECURE_INTERNAL_SERVICES: 'true'
  DROPS_JWT_PUBLIC_KEY_DIR: /var/lib/flashmarket/keys/public
  DROPS_JWT_ALGORITHM: EdDSA
  DROPS_JWT_ISSUER: flashmarket-auth
  DROPS_JWT_AUDIENCE: flashmarket-api

services:
  api:
    <<: *drops-runtime
    build:
      context: ..
      dockerfile: drops/Dockerfile
    environment:
      <<: *drops-environment
      DROPS_LOG_FILE_PATH: /var/log/shide/drops-api.log
    ports:
      - "127.0.0.1:${DROPS_PORT:-4925}:8000"
    volumes:
      - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro
      - backend-logs-local:/var/log/shide
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    mem_limit: ${DROPS_API_MEMORY_LIMIT:-192m}
    mem_reservation: ${DROPS_API_MEMORY_RESERVATION:-72m}
    pids_limit: ${DROPS_API_PIDS_LIMIT:-96}

  maintenance:
    <<: *drops-runtime
    environment:
      <<: *drops-environment
      DROPS_LOG_FILE_PATH: /var/log/shide/drops-maintenance.log
    volumes:
      - backend-logs-local:/var/log/shide
    command: ["celery-worker", "-A", "drops.celery_app:app", "worker", "--pool=solo", "--loglevel=INFO", "--queues=drops.maintenance", "--concurrency=1", "--hostname=drops-maintenance@%h"]
    restart: unless-stopped
    mem_limit: ${DROPS_MAINTENANCE_MEMORY_LIMIT:-128m}
    mem_reservation: ${DROPS_MAINTENANCE_MEMORY_RESERVATION:-40m}
    pids_limit: ${DROPS_MAINTENANCE_PIDS_LIMIT:-64}
    healthcheck:
      test: ["CMD-SHELL", "celery -A drops.celery_app:app inspect ping --destination drops-maintenance@$${HOSTNAME} --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  outbox:
    <<: *drops-runtime
    environment:
      <<: *drops-environment
      DROPS_LOG_FILE_PATH: /var/log/shide/drops-outbox.log
    volumes:
      - backend-logs-local:/var/log/shide
    command:
      - outbox
      - drops.outbox_worker
    restart: unless-stopped
    mem_limit: ${DROPS_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${DROPS_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${DROPS_WORKER_PIDS_LIMIT:-64}
    healthcheck:
      test: ["CMD-SHELL", "python -m rabbitmq_reliability.heartbeat /tmp/flashmarket-heartbeat.json $${DROPS_WORKER_HEARTBEAT_STALE_SECONDS:-45}"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  auth-jwt-keys-public:
  backend-logs-local:
    external: true
    name: shide-backend-logs-local

networks:
  default:
    name: shide-observability
    external: true
