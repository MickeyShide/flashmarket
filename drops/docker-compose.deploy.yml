name: flashmarket-drops

x-drops-runtime: &drops-runtime
  image: ${DROPS_IMAGE:?DROPS_IMAGE must contain the image digest}
  pull_policy: always
  env_file:
    - ${DROPS_ENV_FILE:-.env}

services:
  api:
    <<: *drops-runtime
    mem_limit: ${DROPS_API_MEMORY_LIMIT:-192m}
    mem_reservation: ${DROPS_API_MEMORY_RESERVATION:-72m}
    pids_limit: ${DROPS_API_PIDS_LIMIT:-96}
    init: true
    stop_grace_period: 20s
    logging: &bounded-logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    networks:
      backend:
        aliases:
          - drops
    volumes:
      - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  maintenance:
    <<: *drops-runtime
    mem_limit: ${DROPS_MAINTENANCE_MEMORY_LIMIT:-128m}
    mem_reservation: ${DROPS_MAINTENANCE_MEMORY_RESERVATION:-40m}
    pids_limit: ${DROPS_MAINTENANCE_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 20s
    logging: *bounded-logging
    networks:
      backend:
        aliases: [drops-maintenance]
    command: ["celery-worker", "-A", "drops.celery_app:app", "worker", "--loglevel=INFO", "--queues=drops.maintenance", "--concurrency=1", "--hostname=drops-maintenance@%h"]
    restart: unless-stopped
    labels:
      flashmarket.autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "celery -A drops.celery_app:app inspect ping --destination drops-maintenance@$${HOSTNAME} --timeout 5"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  outbox:
    <<: *drops-runtime
    mem_limit: ${DROPS_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${DROPS_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${DROPS_WORKER_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 20s
    logging: *bounded-logging
    networks:
      backend:
        aliases: [drops-outbox]
    command:
      - outbox
      - drops.outbox_worker
    restart: unless-stopped
    labels:
      flashmarket.autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "python -m rabbitmq_reliability.heartbeat /tmp/flashmarket-heartbeat.json $${DROPS_WORKER_HEARTBEAT_STALE_SECONDS:-45}"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 45s

networks:
  backend:
    external: true
    name: shide-observability

volumes:
  auth-jwt-keys-public:
    external: true
    name: flashmarket-auth-jwt-keys-public
