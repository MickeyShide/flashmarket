server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `/dev` is also a real asset directory containing generated JSON. Exact
    # hub routes must still render the SPA instead of resolving as a directory.
    location = /dev {
        try_files /index.html =404;
    }

    location = /dev/ {
        try_files /index.html =404;
    }

    # The outer gateway owns real readiness probes. A standalone frontend must
    # fail closed instead of returning the SPA with a misleading HTTP 200.
    location ^~ /dev/status/ {
        default_type application/json;
        return 503 '{"status":"unavailable"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /users {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sessions {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
