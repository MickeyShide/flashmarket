name: Purchase Saga E2E Integration

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: saga-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  saga-e2e:
    name: Purchase Saga End-to-End
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Create External Docker Infrastructure Resources
        run: |
          docker network create shide-observability || true
          docker volume create shide-backend-logs-local || true
          docker volume create auth-jwt-keys-private || true
          docker volume create auth-jwt-keys-public || true

          docker run -d --name shide-postgres \
            --network shide-observability \
            -e POSTGRES_USER=shide \
            -e POSTGRES_PASSWORD=shide \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            postgres:17-alpine

          docker run -d --name shide-redis \
            --network shide-observability \
            -p 6379:6379 \
            redis:7-alpine

          docker run -d --name shide-rabbitmq \
            --network shide-observability \
            -e RABBITMQ_DEFAULT_USER=shide \
            -e RABBITMQ_DEFAULT_PASS=shide \
            -p 5672:5672 -p 15672:15672 \
            rabbitmq:3-management-alpine

          sleep 10

      - name: Start Full Docker Compose Stack
        run: |
          docker compose up -d --build
          sleep 30

      - name: Debug - Container Status and Logs
        if: always()
        run: |
          echo "=== Docker Compose PS ==="
          docker compose ps -a
          echo ""
          echo "=== Docker Network Inspect ==="
          docker network inspect shide-observability --format '{{range .Containers}}{{.Name}} {{.IPv4Address}}{{"\n"}}{{end}}'
          echo ""
          echo "=== Gateway Logs ==="
          docker compose logs gateway --tail=30 2>&1 || true
          echo ""
          echo "=== Catalog Logs ==="
          docker compose logs catalog --tail=30 2>&1 || true
          echo ""
          echo "=== Auth Logs ==="
          docker compose logs auth --tail=30 2>&1 || true
          echo ""
          echo "=== Inventory Logs ==="
          docker compose logs inventory --tail=30 2>&1 || true
          echo ""
          echo "=== Orders Logs ==="
          docker compose logs orders --tail=30 2>&1 || true
          echo ""
          echo "=== Payments Logs ==="
          docker compose logs payments --tail=30 2>&1 || true
          echo ""
          echo "=== Direct health checks ==="
          docker compose exec -T gateway wget -qO- http://127.0.0.1/health 2>&1 || echo "Gateway health FAILED"
          docker compose exec -T gateway wget -qO- http://catalog:8000/health/ready 2>&1 || echo "Catalog health from gateway FAILED"
          docker compose exec -T gateway wget -qO- http://auth:8000/health/ready 2>&1 || echo "Auth health from gateway FAILED"

      - name: Run Purchase Saga E2E Integration Suite
        run: |
          uv run --with pytest,pytest-asyncio,httpx,aio-pika pytest tests/test_purchase_saga.py -v -m integration

      - name: Teardown Docker Stack
        if: always()
        run: |
          docker compose down -v
          docker rm -f shide-postgres shide-redis shide-rabbitmq || true
