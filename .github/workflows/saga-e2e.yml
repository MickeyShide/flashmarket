name: Purchase Saga E2E Integration

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: saga-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  saga-e2e:
    name: Purchase Saga End-to-End
    runs-on: ubuntu-latest
    env:
      SAGA_ADMIN_EMAIL: saga-admin@example.com
      SAGA_ADMIN_PASSWORD: SagaAdminPassword123!
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Create External Docker Infrastructure Resources
        run: |
          docker network create shide-observability || true
          docker volume create shide-backend-logs-local || true
          docker run --rm \
            --volume shide-backend-logs-local:/var/log/shide \
            alpine:3.21 \
            chmod 0777 /var/log/shide

          docker run -d --name shide-postgres \
            --network shide-observability \
            -e POSTGRES_USER=shide \
            -e POSTGRES_PASSWORD=shide \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            postgres:17-alpine

          docker run -d --name shide-redis \
            --network shide-observability \
            -p 6379:6379 \
            redis:7-alpine

          docker run -d --name shide-rabbitmq \
            --network shide-observability \
            -e RABBITMQ_DEFAULT_USER=shide \
            -e RABBITMQ_DEFAULT_PASS=shide \
            -e RABBITMQ_DEFAULT_VHOST=flashmarket \
            -p 5672:5672 -p 15672:15672 \
            rabbitmq:3-management-alpine

          # Wait for postgres to accept connections
          echo "Waiting for PostgreSQL..."
          for _ in $(seq 1 30); do
            if docker exec shide-postgres pg_isready -U shide -q 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

          # Create per-service databases
          for db in auth catalog inventory orders payments notifications wishlist drops; do
            docker exec shide-postgres psql -U shide -c "CREATE DATABASE $db;" 2>/dev/null || true
            echo "Created database: $db"
          done

          # Wait for RabbitMQ to be ready
          echo "Waiting for RabbitMQ..."
          for _ in $(seq 1 30); do
            if docker exec shide-rabbitmq rabbitmqctl status >/dev/null 2>&1; then
              echo "RabbitMQ is ready"
              break
            fi
            sleep 1
          done

      - name: Start Full Docker Compose Stack
        run: |
          docker compose up -d --build

          # Wait for critical services to become healthy (up to 120s)
          echo "Waiting for services to become healthy..."
          SERVICES="gateway catalog auth inventory orders payments notifications"
          DEADLINE=$((SECONDS + 120))
          ALL_HEALTHY=false
          while [ $SECONDS -lt $DEADLINE ]; do
            ALL_HEALTHY=true
            for svc in $SERVICES; do
              CONTAINER=$(docker compose ps -q "$svc")
              if [ -z "$CONTAINER" ]; then
                ALL_HEALTHY=false
                break
              fi
              STATUS=$(docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$CONTAINER")
              if [ "$STATUS" != "healthy" ]; then
                ALL_HEALTHY=false
                break
              fi
            done
            if $ALL_HEALTHY; then
              echo "All services healthy!"
              break
            fi
            sleep 3
          done
          docker compose ps -a
          if ! $ALL_HEALTHY; then
            echo "Required services did not become healthy before the deadline"
            exit 1
          fi

      - name: Debug - Container Status and Logs
        if: always()
        run: |
          echo "=== Docker Compose PS ==="
          docker compose ps -a
          echo ""
          echo "=== Docker Network Inspect ==="
          docker network inspect shide-observability --format '{{range .Containers}}{{.Name}} {{.IPv4Address}}{{"\n"}}{{end}}'
          echo ""
          echo "=== Gateway Logs ==="
          docker compose logs gateway --tail=30 2>&1 || true
          echo ""
          echo "=== Catalog Logs ==="
          docker compose logs catalog --tail=30 2>&1 || true
          echo ""
          echo "=== Auth Logs ==="
          docker compose logs auth --tail=30 2>&1 || true
          echo ""
          echo "=== Inventory Logs ==="
          docker compose logs inventory --tail=30 2>&1 || true
          echo ""
          echo "=== Orders Logs ==="
          docker compose logs orders --tail=30 2>&1 || true
          echo ""
          echo "=== Payments Logs ==="
          docker compose logs payments --tail=30 2>&1 || true
          echo ""
          echo "=== Direct health checks ==="
          docker compose exec -T gateway wget -qO- http://127.0.0.1/health 2>&1 || echo "Gateway health FAILED"
          docker compose exec -T gateway wget -qO- http://catalog:8000/health/ready 2>&1 || echo "Catalog health from gateway FAILED"
          docker compose exec -T gateway wget -qO- http://auth:8000/health/ready 2>&1 || echo "Auth health from gateway FAILED"

      - name: Bootstrap E2E Administrator
        run: |
          docker compose exec -T auth \
            .venv/bin/python -m auth_service.cli create-admin \
            --email "$SAGA_ADMIN_EMAIL" \
            --password "$SAGA_ADMIN_PASSWORD" \
            --full-name "Saga E2E Administrator"

      - name: Run Purchase Saga E2E Integration Suite
        run: |
          uv run --with pytest,pytest-asyncio,httpx,aio-pika pytest tests/test_purchase_saga.py -v -m integration

      - name: Teardown Docker Stack
        if: always()
        run: |
          docker compose down -v
          docker rm -f shide-postgres shide-redis shide-rabbitmq || true
