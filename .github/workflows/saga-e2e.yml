name: Purchase Saga E2E Integration

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: saga-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  saga-e2e:
    name: Purchase Saga End-to-End
    runs-on: ubuntu-latest
    env:
      SAGA_ADMIN_EMAIL: saga-admin@example.com
      SAGA_ADMIN_PASSWORD: SagaAdminPassword123!
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Run isolated Purchase Saga stack and tests
        timeout-minutes: 30
        run: uv run python scripts/test_runner.py test-e2e
