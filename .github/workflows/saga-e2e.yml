name: Purchase Saga E2E Integration

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: saga-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  saga-e2e:
    name: Purchase Saga End-to-End
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Start Full Docker Compose Stack
        run: |
          docker compose up -d --build
          sleep 15

      - name: Run Purchase Saga E2E Integration Suite
        run: |
          uv run pytest tests/test_purchase_saga.py -v -m integration

      - name: Teardown Docker Stack
        if: always()
        run: docker compose down -v
