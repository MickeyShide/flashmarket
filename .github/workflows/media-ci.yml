name: Media CI / Deploy

on:
  pull_request:
    branches: [develop, main]
    paths:
      - media/**
      - shared/jwt_verifier/**
      - docker/init-infra.py
      - docker/entrypoint.sh
      - .github/workflows/media-ci.yml
  push:
    branches: [develop, main]
    tags:
      - media-v*
    paths:
      - media/**
      - shared/jwt_verifier/**
      - docker/init-infra.py
      - docker/entrypoint.sh
      - .github/workflows/media-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  UV_VERSION: "0.11.32"
  IMAGE_NAME: ghcr.io/mickeyshide/flashmarket-media

jobs:
  quality:
    name: Lint, types, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: media/uv.lock

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: mypy
        run: uv run mypy

      - name: Tests
        run: uv run pytest -m "not integration"

      - name: Validate standalone Compose
        working-directory: .
        run: docker compose -f media/docker-compose.yml config --quiet

  image:
    name: Build Media image
    needs: [quality]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./media/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=flashmarket-media
          cache-to: type=gha,mode=max,scope=flashmarket-media

  deploy:
    name: Deploy production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/media-v')
    needs: [image]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '176.108.242.100' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'user1' }}
      DEPLOY_PATH: ${{ vars.MEDIA_DEPLOY_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USERNAME: ${{ github.actor }}
      INFRA_USER: ${{ vars.INFRA_USER || 'shide' }}
      MEDIA_IMAGE: ghcr.io/mickeyshide/flashmarket-media@${{ needs.image.outputs.digest }}
      MEDIA_S3_BUCKET: ${{ vars.MEDIA_S3_BUCKET || 'flashmarket-public' }}
      MEDIA_CORS_ORIGINS: ${{ vars.MEDIA_CORS_ORIGINS }}
      GATEWAY_DOMAIN: ${{ vars.GATEWAY_DOMAIN || 'flashmarket.shide.world' }}
      DEPLOY_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        shell: bash
        run: |
          DEPLOY_HOST="${DEPLOY_HOST:-176.108.242.100}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_USER="${DEPLOY_USER:-user1}"
          INFRA_USER="${INFRA_USER:-shide}"
          : "${DEPLOY_POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::DEPLOY_HOST must be a hostname or IPv4 address"
            exit 1
          fi
          if [[ ! "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "::error::DEPLOY_USER is invalid"
            exit 1
          fi
          if [[ -z "$DEPLOY_PATH" ]]; then
            DEPLOY_PATH="/home/${DEPLOY_USER}/flashmarket-media"
            echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"
          fi
          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]] ||
            (( DEPLOY_PORT < 1 || DEPLOY_PORT > 65535 )); then
            echo "::error::DEPLOY_PORT must be between 1 and 65535"
            exit 1
          fi
          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::DEPLOY_PATH must be an absolute Unix path"
            exit 1
          fi
          if [[ ! "$GATEWAY_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::GATEWAY_DOMAIN must contain only a DNS hostname"
            exit 1
          fi
          if [[ ! "$INFRA_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "::error::INFRA_USER is invalid"
            exit 1
          fi
          if [[ ! "$MEDIA_S3_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::MEDIA_S3_BUCKET is invalid"
            exit 1
          fi
          if [[ -z "$SSH_PRIVATE_KEY" ]]; then
            echo "::error::DEPLOY_SSH_KEY is required"
            exit 1
          fi
          if [[ -z "${{ needs.image.outputs.digest }}" ]]; then
            echo "::error::Media image digest is missing"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: bash scripts/configure-deploy-ssh.sh

      - name: Render production environment
        shell: bash
        run: |
          environment_file="$RUNNER_TEMP/flashmarket-media.env"
          cors_origins="${MEDIA_CORS_ORIGINS:-[\"https://${GATEWAY_DOMAIN}\"]}"
          umask 077
          {
            printf 'MEDIA_IMAGE=%s\n' "$MEDIA_IMAGE"
            printf 'MEDIA_ENVIRONMENT=production\n'
            printf 'MEDIA_DATABASE_URL=postgresql+asyncpg://%s:%s@shide-postgres:5432/media\n' "$INFRA_USER" "$DEPLOY_POSTGRES_PASSWORD"
            printf 'MEDIA_S3_INTERNAL_ENDPOINT=http://shide-minio:9000\n'
            printf 'MEDIA_S3_PUBLIC_ENDPOINT=https://%s/media-storage\n' "$GATEWAY_DOMAIN"
            printf 'MEDIA_S3_BUCKET=%s\n' "$MEDIA_S3_BUCKET"
            printf 'MEDIA_S3_REGION=us-east-1\n'
            printf 'MEDIA_S3_ADDRESSING_STYLE=path\n'
            printf 'MEDIA_PUBLIC_BASE_URL=https://%s/media-storage/%s\n' "$GATEWAY_DOMAIN" "$MEDIA_S3_BUCKET"
            printf 'MEDIA_UPLOAD_TTL_SECONDS=600\n'
            printf 'MEDIA_CLEANUP_INTERVAL_SECONDS=30\n'
            printf 'MEDIA_CORS_ORIGINS=%s\n' "$cors_origins"
            printf 'MEDIA_TRUSTED_HOSTS=["%s","media.%s","localhost","127.0.0.1","media","gateway"]\n' "$GATEWAY_DOMAIN" "$GATEWAY_DOMAIN"
            printf 'MEDIA_ALLOW_INSECURE_INTERNAL_SERVICES=true\n'
            printf 'MEDIA_JWT_PUBLIC_KEY_DIR=/var/lib/flashmarket/keys/public\n'
            printf 'MEDIA_JWT_ALGORITHM=EdDSA\n'
            printf 'MEDIA_JWT_ISSUER=flashmarket-auth\n'
            printf 'MEDIA_JWT_AUDIENCE=flashmarket-api\n'
            printf 'MEDIA_DEBUG=false\n'
            printf 'MEDIA_DOCS_ENABLED=false\n'
            printf 'INFRA_USER=%s\n' "$INFRA_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$DEPLOY_POSTGRES_PASSWORD"
          } > "$environment_file"
          chmod 600 "$environment_file"

      - name: Upload deployment files
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -p "$DEPLOY_PORT" "$target" "mkdir -p '$DEPLOY_PATH'"
          scp -P "$DEPLOY_PORT" \
            media/docker-compose.deploy.yml \
            "$target:$DEPLOY_PATH/docker-compose.yml"
          scp -P "$DEPLOY_PORT" \
            media/policies/public-read-no-list.json.template \
            "$target:$DEPLOY_PATH/public-read-no-list.json.template"
          ssh -p "$DEPLOY_PORT" "$target" \
            "umask 077; cat > '$DEPLOY_PATH/.env.next' && mv '$DEPLOY_PATH/.env.next' '$DEPLOY_PATH/.env'" \
            < "$RUNNER_TEMP/flashmarket-media.env"

      - name: Log server in to GHCR
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          printf '%s' "$GHCR_TOKEN" |
            ssh -p "$DEPLOY_PORT" "$target" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Deploy exact image digest
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -p "$DEPLOY_PORT" "$target" \
            "DEPLOY_PATH='$DEPLOY_PATH' MEDIA_IMAGE='$MEDIA_IMAGE' MEDIA_S3_BUCKET='$MEDIA_S3_BUCKET' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          exec 9>/tmp/flashmarket-production-deploy.lock
          flock -w 1800 9
          cd "$DEPLOY_PATH"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          if [[ ! -f .env ]]; then
            echo "Missing $DEPLOY_PATH/.env"
            exit 1
          fi

          get_container_env() {
            container="$1"
            name="$2"
            prefix="${name}="
            line="$(
              docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container" |
                awk -v prefix="$prefix" 'index($0, prefix) == 1 { print substr($0, length(prefix) + 1); exit }'
            )"
            [[ -n "$line" ]] || {
              echo "Required environment variable $name is missing from $container" >&2
              return 1
            }
            printf '%s' "$line"
          }

          s3_access_key="$(get_container_env shide-minio MINIO_ROOT_USER)"
          s3_secret_key="$(get_container_env shide-minio MINIO_ROOT_PASSWORD)"
          runtime_env="$(mktemp "$DEPLOY_PATH/.env.runtime.XXXXXX")"
          {
            cat .env
            printf 'MEDIA_S3_ACCESS_KEY=%s\n' "$s3_access_key"
            printf 'MEDIA_S3_SECRET_KEY=%s\n' "$s3_secret_key"
            printf 'S3_ACCESS_KEY=%s\n' "$s3_access_key"
            printf 'S3_SECRET_KEY=%s\n' "$s3_secret_key"
          } > "$runtime_env"
          chmod 600 "$runtime_env"
          mv "$runtime_env" .env

          echo 'Preparing Media object-storage bucket...'
          docker exec shide-minio mc alias set \
            flashmarket-media-local \
            http://localhost:9000 \
            "$s3_access_key" \
            "$s3_secret_key" >/dev/null
          docker exec shide-minio mc mb --ignore-existing \
            "flashmarket-media-local/$MEDIA_S3_BUCKET" >/dev/null
          policy_file="$(mktemp "$DEPLOY_PATH/public-read-no-list.XXXXXX.json")"
          container_policy="/tmp/flashmarket-public-read-$$.json"
          sed "s|\${MEDIA_S3_BUCKET}|$MEDIA_S3_BUCKET|g" \
            public-read-no-list.json.template > "$policy_file"
          docker cp "$policy_file" "shide-minio:$container_policy"
          docker exec shide-minio mc anonymous set-json \
            "$container_policy" \
            "flashmarket-media-local/$MEDIA_S3_BUCKET" >/dev/null
          rm -f "$policy_file"
          docker exec shide-minio rm -f "$container_policy"

          export MEDIA_IMAGE
          docker compose -f docker-compose.yml --env-file .env config --quiet
          docker compose -f docker-compose.yml --env-file .env pull

          echo 'Applying Media database migrations...'
          timeout 120 docker compose -f docker-compose.yml --env-file .env run --rm --no-deps api migrate </dev/null
          echo 'Database migrations complete.'

          echo 'Starting Media API and cleanup worker...'
          docker compose -f docker-compose.yml --env-file .env up \
            -d \
            --no-build \
            --force-recreate \
            --remove-orphans \
            api cleanup

          container="$(docker compose -f docker-compose.yml --env-file .env ps -q api)"
          for attempt in $(seq 1 60); do
            health="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$container"
            )"
            if [[ "$health" == "healthy" ]]; then
              break
            fi
            sleep 2
          done
          final_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
          [[ "$final_health" == "healthy" ]] || {
            docker compose -f docker-compose.yml --env-file .env logs --tail 100 api
            exit 1
          }
          cleanup_container="$(docker compose -f docker-compose.yml --env-file .env ps -q cleanup)"
          if [[ -z "$cleanup_container" ]]; then
            docker compose -f docker-compose.yml --env-file .env logs --tail 100 cleanup
            exit 1
          fi
          for attempt in $(seq 1 60); do
            cleanup_health="$(docker inspect --format '{{.State.Health.Status}}' "$cleanup_container")"
            [[ "$cleanup_health" == "healthy" ]] && break
            sleep 2
          done
          [[ -n "$cleanup_container" ]] && [[ "$(docker inspect --format '{{.State.Health.Status}}' "$cleanup_container")" == "healthy" ]] || {
            docker compose -f docker-compose.yml --env-file .env logs --tail 100 cleanup
            exit 1
          }
          docker compose -f docker-compose.yml --env-file .env ps -a
          REMOTE

      - name: Verify public Media upstream
        shell: bash
        run: |
          last_error=""
          for _ in $(seq 1 30); do
            if response="$(
              curl --fail --silent --show-error \
                "https://${GATEWAY_DOMAIN}/dev/status/media" 2>&1
            )"; then
              printf '%s\n' "$response"
              exit 0
            fi
            last_error="$response"
            sleep 2
          done
          echo "::error::Media is not reachable through the production gateway"
          printf 'Last curl error: %s\n' "$last_error"
          exit 1
