name: Media CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - media/**
      - shared/jwt_verifier/**
      - docker/init-infra.py
      - docker/entrypoint.sh
      - .github/workflows/media-ci.yml
  push:
    branches: [develop, main]
    tags:
      - media-v*
    paths:
      - media/**
      - shared/jwt_verifier/**
      - docker/init-infra.py
      - docker/entrypoint.sh
      - .github/workflows/media-ci.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"
  IMAGE_NAME: ghcr.io/mickeyshide/flashmarket-media

jobs:
  quality:
    name: Lint, types, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: media/uv.lock

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: mypy
        run: uv run mypy

      - name: Tests
        run: uv run pytest -m "not integration"

      - name: Validate standalone Compose
        working-directory: .
        run: docker compose -f media/docker-compose.yml config --quiet

  image:
    name: Build Media image
    needs: [quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./media/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=flashmarket-media
          cache-to: type=gha,mode=max,scope=flashmarket-media
