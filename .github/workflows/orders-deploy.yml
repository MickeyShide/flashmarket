name: Orders CI / Deploy

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - orders/**
      - .github/workflows/orders-deploy.yml
  push:
    branches:
      - develop
      - main
    tags:
      - orders-v*
    paths:
      - orders/**
      - .github/workflows/orders-deploy.yml
  workflow_dispatch:

concurrency:
  group: orders-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"
  IMAGE_NAME: ghcr.io/mickeyshide/flashmarket-orders

jobs:
  ruff:
    name: Ruff warnings
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: orders
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: orders/uv.lock

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run Ruff as warnings
        shell: bash
        run: |
          set +e
          lint_report="$(uv run ruff check . --output-format=concise 2>&1)"
          lint_status=$?
          format_report="$(uv run ruff format --check . 2>&1)"
          format_status=$?
          report="$(printf 'ruff check:\n%s\n\nruff format --check:\n%s\n' "$lint_report" "$format_report")"
          printf '%s\n' "$report"

          if (( lint_status != 0 || format_status != 0 )); then
            echo "::warning title=Ruff::Ruff found code-style issues. This check does not block deploy."
            {
              echo "### ⚠️ Ruff"
              echo
              echo '```text'
              printf '%s\n' "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Ruff: no issues" >> "$GITHUB_STEP_SUMMARY"
          fi

          exit 0

  mypy:
    name: mypy warnings
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: orders
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: orders/uv.lock

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run mypy as warnings
        shell: bash
        run: |
          set +e
          report="$(uv run mypy 2>&1)"
          status=$?
          printf '%s\n' "$report"

          if (( status != 0 )); then
            echo "::warning title=mypy::mypy found type issues. This check does not block deploy."
            {
              echo "### ⚠️ mypy"
              echo
              echo '```text'
              printf '%s\n' "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ mypy: no issues" >> "$GITHUB_STEP_SUMMARY"
          fi

          exit 0

  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: orders
          POSTGRES_USER: flashmarket
          POSTGRES_PASSWORD: flashmarket
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U flashmarket -d orders"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: orders
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: orders/uv.lock

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        env:
          ORDERS_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@localhost:5435/orders
        run: uv run pytest

  image:
    name: Build image
    needs:
      - tests
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./orders/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=flashmarket-orders
          cache-to: type=gha,mode=max,scope=flashmarket-orders

  deploy:
    name: Deploy production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/orders-v')
    needs:
      - image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '176.108.242.100' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'user1' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USERNAME: ${{ github.actor }}
      INFRA_USER: ${{ vars.INFRA_USER || 'shide' }}
      ORDERS_IMAGE: ghcr.io/mickeyshide/flashmarket-orders@${{ needs.image.outputs.digest }}
      GATEWAY_DOMAIN: ${{ vars.GATEWAY_DOMAIN || 'flashmarket.shide.world' }}
      ORDERS_CORS_ORIGINS: ${{ vars.ORDERS_CORS_ORIGINS }}
      DEPLOY_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DEPLOY_RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        shell: bash
        run: |
          DEPLOY_HOST="${DEPLOY_HOST:-176.108.242.100}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_USER="${DEPLOY_USER:-user1}"
          ORDERS_DOMAIN="orders.${GATEWAY_DOMAIN}"
          INFRA_USER="${INFRA_USER:-shide}"
          : "${DEPLOY_POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
          : "${DEPLOY_RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"

          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::DEPLOY_HOST must be a hostname or IPv4 address"
            exit 1
          fi
          if [[ ! "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "::error::DEPLOY_USER is invalid"
            exit 1
          fi
          if [[ -z "$DEPLOY_PATH" ]]; then
            DEPLOY_PATH="/home/${DEPLOY_USER}/flashmarket-orders"
            echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"
          fi
          : "${DEPLOY_PATH:?DEPLOY_PATH could not be derived}"
          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]] ||
            (( DEPLOY_PORT < 1 || DEPLOY_PORT > 65535 )); then
            echo "::error::DEPLOY_PORT must be between 1 and 65535"
            exit 1
          fi
          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::DEPLOY_PATH must be an absolute Unix path"
            exit 1
          fi
          if [[ ! "$ORDERS_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::ORDERS_DOMAIN must contain only a DNS hostname"
            exit 1
          fi
          if [[ ! "$INFRA_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "::error::INFRA_USER is invalid"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: bash scripts/configure-deploy-ssh.sh

      - name: Render production environment
        shell: bash
        run: |
          environment_file="$RUNNER_TEMP/flashmarket-orders.env"
          cors_origins="${ORDERS_CORS_ORIGINS:-[\"https://${ORDERS_DOMAIN}\",\"https://${GATEWAY_DOMAIN}\"]}"
          umask 077
          {
            printf 'ORDERS_IMAGE=%s\n' "$ORDERS_IMAGE"
            printf 'ORDERS_PROXY_PORT=4920\n'
            printf 'ORDERS_ENVIRONMENT=production\n'
            printf 'ORDERS_DOMAIN=%s\n' "$ORDERS_DOMAIN"
            printf 'ORDERS_DATABASE_URL=postgresql+asyncpg://%s:%s@shide-postgres:5432/orders\n' "$INFRA_USER" "$DEPLOY_POSTGRES_PASSWORD"
            printf 'ORDERS_RABBITMQ_URL=amqp://%s:%s@shide-rabbitmq:5672/flashmarket\n' "$INFRA_USER" "$DEPLOY_RABBITMQ_PASSWORD"
            printf 'ORDERS_ALLOW_INSECURE_INTERNAL_SERVICES=true\n'
            printf 'ORDERS_DEBUG=false\n'
            printf 'ORDERS_DOCS_ENABLED=false\n'
            printf 'ORDERS_CORS_ORIGINS=%s\n' "$cors_origins"
            printf 'ORDERS_TRUSTED_HOSTS=["%s","%s","*.%s","localhost","127.0.0.1","orders","api"]\n' "$ORDERS_DOMAIN" "$GATEWAY_DOMAIN" "$GATEWAY_DOMAIN"
            printf 'ORDERS_PAYMENT_TIMEOUT_SECONDS=300\n'
            printf 'INFRA_USER=%s\n' "$INFRA_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$DEPLOY_POSTGRES_PASSWORD"
            printf 'RABBITMQ_PASSWORD=%s\n' "$DEPLOY_RABBITMQ_PASSWORD"
          } > "$environment_file"
          chmod 600 "$environment_file"

      - name: Upload deployment files
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -p "$DEPLOY_PORT" "$target" "mkdir -p '$DEPLOY_PATH'"
          scp -P "$DEPLOY_PORT" \
            orders/docker-compose.deploy.yml \
            "$target:$DEPLOY_PATH/docker-compose.yml"
          scp -P "$DEPLOY_PORT" \
            orders/nginx.conf.template \
            "$target:$DEPLOY_PATH/nginx.conf.template"
          ssh -p "$DEPLOY_PORT" "$target" \
            "umask 077; cat > '$DEPLOY_PATH/.env.next' && mv '$DEPLOY_PATH/.env.next' '$DEPLOY_PATH/.env'" \
            < "$RUNNER_TEMP/flashmarket-orders.env"

      - name: Log server in to GHCR
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          printf '%s' "$GHCR_TOKEN" |
            ssh -p "$DEPLOY_PORT" "$target" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Deploy exact image digest
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -p "$DEPLOY_PORT" "$target" \
            "DEPLOY_PATH='$DEPLOY_PATH' ORDERS_IMAGE='$ORDERS_IMAGE' ORDERS_DOMAIN='$ORDERS_DOMAIN' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          exec 9>/tmp/flashmarket-production-deploy.lock
          flock -w 1800 9
          cd "$DEPLOY_PATH"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          if [[ ! -f .env ]]; then
            echo "Missing $DEPLOY_PATH/.env"
            exit 1
          fi

          export ORDERS_IMAGE
          if ! docker compose --env-file .env config --quiet; then
            echo '::error title=Orders Compose configuration invalid::docker compose config failed'
            exit 1
          fi
          if ! docker compose --env-file .env pull; then
            echo '::error title=Orders image pull failed::Unable to pull the exact image digest'
            exit 1
          fi

          wait_for_healthy() {
            service="$1"
            container="$(docker compose --env-file .env ps -q "$service")"
            for attempt in $(seq 1 60); do
              health="$(
                docker inspect \
                  --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                  "$container"
              )"
              if [[ "$health" == "healthy" ]]; then
                return 0
              fi
              sleep 2
            done
            docker compose --env-file .env logs --tail 100 "$service"
            state="$(
              docker inspect \
                --format 'status={{.State.Status}},exit={{.State.ExitCode}},restarts={{.RestartCount}},error={{.State.Error}}' \
                "$container"
            )"
            printf '::error title=Orders %s health details::%s\n' "$service" "$state"
            if [[ "$service" == "consumer" || "$service" == "outbox" ]]; then
              if docker compose --env-file .env exec -T "$service" python -c \
                "import socket; socket.create_connection(('shide-rabbitmq', 5672), 5).close()"; then
                printf '::notice title=Orders %s RabbitMQ TCP probe::reachable\n' "$service"
              else
                printf '::error title=Orders %s RabbitMQ TCP probe::unreachable\n' "$service"
              fi
            fi
            return 1
          }

          echo 'Applying database migrations...'
          if ! timeout 120 docker compose -f docker-compose.yml --env-file .env run --rm --no-deps api migrate </dev/null; then
            echo '::error title=Orders migration failed::The production migration command failed or timed out'
            exit 1
          fi
          echo 'Database migrations complete.'

          echo 'Starting Orders runtime containers...'
          if ! docker compose --env-file .env up \
              -d \
              --no-build \
              --force-recreate \
              --remove-orphans \
              api consumer outbox nginx; then
            echo '::error title=Orders container start failed::docker compose up failed'
            exit 1
          fi
          echo 'Orders runtime containers started.'

          echo 'Waiting for Orders API...'
          if ! wait_for_healthy api; then
            echo '::error title=Orders API unhealthy::The API did not become healthy'
            exit 1
          fi
          echo 'Waiting for Orders workers...'
          if ! wait_for_healthy consumer; then
            echo '::error title=Orders consumer unhealthy::The consumer heartbeat did not become healthy'
            exit 1
          fi
          if ! wait_for_healthy outbox; then
            echo '::error title=Orders outbox unhealthy::The outbox heartbeat did not become healthy'
            exit 1
          fi
          echo 'Waiting for internal Nginx...'
          if ! wait_for_healthy nginx; then
            echo '::error title=Orders Nginx unhealthy::The internal proxy did not become healthy'
            exit 1
          fi
          docker compose --env-file .env ps -a
          echo 'Checking internal Nginx endpoint...'
          curl --fail --silent --show-error \
            http://127.0.0.1:4920/health/ready
          REMOTE

      - name: Verify public HTTPS endpoint
        shell: bash
        run: |
          if [[ -z "${ORDERS_DOMAIN:-}" ]]; then
            echo "ORDERS_DOMAIN is empty. Internal deployment succeeded."
            exit 0
          fi

          last_error=""
          for _ in $(seq 1 30); do
            if response="$(
              curl --fail --silent --show-error \
                "https://${ORDERS_DOMAIN}/health/ready" 2>&1
            )"; then
              printf '%s\n' "$response"
              exit 0
            fi
            last_error="$response"
            sleep 2
          done

          echo "::warning title=Public HTTPS check failed::Orders API is not reachable through Nginx Proxy Manager at https://${ORDERS_DOMAIN}/health/ready"
          printf 'Last curl error: %s\n' "$last_error"

          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          if ssh -p "$DEPLOY_PORT" "$target" \
            "curl --fail --silent --show-error http://127.0.0.1:4920/health/ready"; then
            echo
            echo "::notice title=Orders nginx is healthy::Configure Nginx Proxy Manager for ${ORDERS_DOMAIN} with upstream ${DEPLOY_HOST}:4920 and enable SSL"
            exit 0
          fi
          ssh -p "$DEPLOY_PORT" "$target" \
            "cd '$DEPLOY_PATH' && docker compose --env-file .env ps -a && ss -ltn '( sport = :4920 )' || true; docker compose --env-file .env logs --tail 100 api nginx"
          exit 1
