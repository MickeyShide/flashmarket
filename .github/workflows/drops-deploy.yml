name: Drops CI / Deploy

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - drops/**
      - .github/workflows/drops-deploy.yml
      - tests/test_drops_deployment_workflow.py
  push:
    branches:
      - develop
      - main
    tags:
      - drops-v*
    paths:
      - drops/**
      - .github/workflows/drops-deploy.yml
      - tests/test_drops_deployment_workflow.py
  workflow_dispatch:

concurrency:
  group: drops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"
  IMAGE_NAME: ghcr.io/mickeyshide/flashmarket-drops

jobs:
  ruff:
    name: Ruff warnings
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: drops
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: drops/uv.lock

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run Ruff as warnings
        run: uv run ruff check .

  pytest:
    name: Pytest suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drops
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: drops/uv.lock

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run unit & integration tests
        run: uv run pytest -q -p no:cacheprovider

  image:
    name: Build Drops image
    needs:
      - pytest
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./drops/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=flashmarket-drops
          cache-to: type=gha,mode=max,scope=flashmarket-drops

  deploy:
    name: Deploy production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/drops-v')
    needs:
      - image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '176.108.242.100' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'user1' }}
      DEPLOY_PATH: ${{ vars.DROPS_DEPLOY_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USERNAME: ${{ github.actor }}
      INFRA_USER: ${{ vars.INFRA_USER || 'shide' }}
      DROPS_IMAGE: ghcr.io/mickeyshide/flashmarket-drops@${{ needs.image.outputs.digest }}
      DROPS_CORS_ORIGINS: ${{ vars.DROPS_CORS_ORIGINS }}
      GATEWAY_DOMAIN: ${{ vars.GATEWAY_DOMAIN || 'flashmarket.shide.world' }}
      DEPLOY_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DEPLOY_RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        shell: bash
        run: |
          DEPLOY_HOST="${DEPLOY_HOST:-176.108.242.100}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_USER="${DEPLOY_USER:-user1}"
          INFRA_USER="${INFRA_USER:-shide}"

          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::DEPLOY_HOST must be a hostname or IPv4 address"
            exit 1
          fi
          if [[ ! "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "::error::DEPLOY_USER is invalid"
            exit 1
          fi
          if [[ -z "$DEPLOY_PATH" ]]; then
            DEPLOY_PATH="/home/${DEPLOY_USER}/flashmarket-drops"
            echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"
          fi
          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]] ||
            (( DEPLOY_PORT < 1 || DEPLOY_PORT > 65535 )); then
            echo "::error::DEPLOY_PORT must be between 1 and 65535"
            exit 1
          fi
          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::DEPLOY_PATH must be an absolute Unix path"
            exit 1
          fi
          if [[ ! "$GATEWAY_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::GATEWAY_DOMAIN must contain only a DNS hostname"
            exit 1
          fi
          if [[ ! "$INFRA_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "::error::INFRA_USER is invalid"
            exit 1
          fi
          if [[ -z "$SSH_PRIVATE_KEY" ]]; then
            echo "::error::DEPLOY_SSH_KEY is required"
            exit 1
          fi
          if [[ -z "$DEPLOY_POSTGRES_PASSWORD" ]]; then
            echo "::error::POSTGRES_PASSWORD is required"
            exit 1
          fi
          if [[ -z "$DEPLOY_RABBITMQ_PASSWORD" ]]; then
            echo "::error::RABBITMQ_PASSWORD is required"
            exit 1
          fi
          if [[ -z "${{ needs.image.outputs.digest }}" ]]; then
            echo "::error::Drops image digest is missing"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: bash scripts/configure-deploy-ssh.sh

      - name: Render production environment
        shell: bash
        run: |
          environment_file="$RUNNER_TEMP/flashmarket-drops.env"
          cors_origins="${DROPS_CORS_ORIGINS:-[\"https://${GATEWAY_DOMAIN}\"]}"
          umask 077
          {
            printf 'DROPS_IMAGE=%s\n' "$DROPS_IMAGE"
            printf 'DROPS_ENVIRONMENT=production\n'
            printf 'DROPS_DATABASE_URL=postgresql+asyncpg://%s:%s@shide-postgres:5432/drops\n' "$INFRA_USER" "$DEPLOY_POSTGRES_PASSWORD"
            printf 'DROPS_RABBITMQ_URL=amqp://%s:%s@shide-rabbitmq:5672/flashmarket\n' "$INFRA_USER" "$DEPLOY_RABBITMQ_PASSWORD"
            printf 'DROPS_CORS_ORIGINS=%s\n' "$cors_origins"
            printf 'DROPS_TRUSTED_HOSTS=["%s","drops.%s","localhost","127.0.0.1","drops","gateway"]\n' "$GATEWAY_DOMAIN" "$GATEWAY_DOMAIN"
            printf 'DROPS_ALLOW_INSECURE_INTERNAL_SERVICES=true\n'
            printf 'DROPS_JWT_PUBLIC_KEY_DIR=/var/lib/flashmarket/keys/public\n'
            printf 'DROPS_JWT_ALGORITHM=EdDSA\n'
            printf 'DROPS_JWT_ISSUER=flashmarket-auth\n'
            printf 'DROPS_JWT_AUDIENCE=flashmarket-api\n'
            printf 'DROPS_DEBUG=false\n'
            printf 'DROPS_DOCS_ENABLED=false\n'
          } > "$environment_file"
          chmod 600 "$environment_file"

      - name: Upload deployment files
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -p "$DEPLOY_PORT" "$target" "mkdir -p '$DEPLOY_PATH'"
          scp -P "$DEPLOY_PORT" \
            drops/docker-compose.deploy.yml \
            "$target:$DEPLOY_PATH/docker-compose.yml"
          ssh -p "$DEPLOY_PORT" "$target" \
            "umask 077; cat > '$DEPLOY_PATH/.env.next' && mv '$DEPLOY_PATH/.env.next' '$DEPLOY_PATH/.env'" \
            < "$RUNNER_TEMP/flashmarket-drops.env"

      - name: Log server in to GHCR
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          printf '%s' "$GHCR_TOKEN" |
            ssh -p "$DEPLOY_PORT" "$target" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Deploy exact image digest
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          timeout --signal=TERM --kill-after=30s 2400 \
            ssh -p "$DEPLOY_PORT" "$target" \
            "DEPLOY_PATH='$DEPLOY_PATH' DROPS_IMAGE='$DROPS_IMAGE' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          exec 9>/tmp/flashmarket-production-deploy.lock
          flock -w 1800 9
          cd "$DEPLOY_PATH"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          if [[ ! -f .env ]]; then
            echo "Missing $DEPLOY_PATH/.env"
            exit 1
          fi

          export DROPS_IMAGE
          docker compose -f docker-compose.yml --env-file .env config --quiet
          docker compose -f docker-compose.yml --env-file .env pull

          echo 'Applying Drops database migrations...'
          timeout 120 docker compose -f docker-compose.yml --env-file .env run --rm --no-deps api migrate </dev/null
          echo 'Database migrations complete.'

          echo 'Starting Drops API, scheduler, and outbox worker...'
          docker compose -f docker-compose.yml --env-file .env up \
            -d \
            --no-build \
            --force-recreate \
            --remove-orphans \
            api scheduler outbox

          api_container="$(docker compose -f docker-compose.yml --env-file .env ps -q api)"
          for attempt in $(seq 1 60); do
            health="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$api_container"
            )"
            if [[ "$health" == "healthy" ]]; then
              break
            fi
            sleep 2
          done
          final_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$api_container")"
          if [[ "$final_health" != "healthy" ]]; then
            docker compose -f docker-compose.yml --env-file .env logs --tail 100 api
            exit 1
          fi

          for service in scheduler outbox; do
            container="$(docker compose -f docker-compose.yml --env-file .env ps -q "$service")"
            if [[ -z "$container" ]]; then
              docker compose -f docker-compose.yml --env-file .env logs --tail 100 "$service"
              exit 1
            fi
            for attempt in $(seq 1 30); do
              worker_health="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
              [[ "$worker_health" == "healthy" ]] && break
              sleep 2
            done
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" != "healthy" ]]; then
              docker compose -f docker-compose.yml --env-file .env logs --tail 100 "$service"
              exit 1
            fi
          done
          docker compose -f docker-compose.yml --env-file .env ps -a
          REMOTE

      - name: Verify public Drops upstream
        shell: bash
        run: |
          last_error=""
          for _ in $(seq 1 30); do
            if response="$(
              curl --fail --silent --show-error \
                "https://${GATEWAY_DOMAIN}/dev/status/drops" 2>&1
            )"; then
              printf '%s\n' "$response"
              exit 0
            fi
            last_error="$response"
            sleep 2
          done
          echo "::error::Drops is not reachable through the production gateway"
          printf 'Last curl error: %s\n' "$last_error"
          exit 1
