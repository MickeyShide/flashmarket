name: Catalog CI / Deploy

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - catalog/**
      - .github/workflows/catalog-deploy.yml
  push:
    branches:
      - develop
      - main
    tags:
      - catalog-v*
    paths:
      - catalog/**
      - .github/workflows/catalog-deploy.yml
  workflow_dispatch:

concurrency:
  group: catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"
  IMAGE_NAME: ghcr.io/mickeyshide/flashmarket-catalog

jobs:
  ruff:
    name: Ruff warnings
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: catalog
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: catalog/uv.lock

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run Ruff as warnings
        shell: bash
        run: |
          set +e
          lint_report="$(uv run ruff check . --output-format=concise 2>&1)"
          lint_status=$?
          format_report="$(uv run ruff format --check . 2>&1)"
          format_status=$?
          report="$(printf 'ruff check:\n%s\n\nruff format --check:\n%s\n' "$lint_report" "$format_report")"
          printf '%s\n' "$report"

          if (( lint_status != 0 || format_status != 0 )); then
            echo "::warning title=Ruff::Ruff found code-style issues. This check does not block deploy."
            {
              echo "### ⚠️ Ruff"
              echo
              echo '```text'
              printf '%s\n' "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Ruff: no issues" >> "$GITHUB_STEP_SUMMARY"
          fi

          exit 0

  mypy:
    name: mypy warnings
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: catalog
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: catalog/uv.lock

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run mypy as warnings
        shell: bash
        run: |
          set +e
          report="$(uv run mypy 2>&1)"
          status=$?
          printf '%s\n' "$report"

          if (( status != 0 )); then
            echo "::warning title=mypy::mypy found type issues. This check does not block deploy."
            {
              echo "### ⚠️ mypy"
              echo
              echo '```text'
              printf '%s\n' "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ mypy: no issues" >> "$GITHUB_STEP_SUMMARY"
          fi

          exit 0

  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: catalog
          POSTGRES_USER: flashmarket
          POSTGRES_PASSWORD: flashmarket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flashmarket -d catalog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: catalog
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: catalog/uv.lock

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        env:
          CATALOG_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@localhost:5432/catalog
        run: uv run pytest

  image:
    name: Build image
    needs:
      - tests
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./catalog/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=flashmarket-catalog
          cache-to: type=gha,mode=max,scope=flashmarket-catalog

  deploy:
    name: Deploy production
    concurrency:
      group: flashmarket-production-deploy
      cancel-in-progress: false
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/catalog-v')
    needs:
      - image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '176.108.242.100' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'user1' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USERNAME: ${{ github.actor }}
      INFRA_USER: ${{ vars.INFRA_USER || 'shide' }}
      CATALOG_IMAGE: ghcr.io/mickeyshide/flashmarket-catalog@${{ needs.image.outputs.digest }}
      GATEWAY_DOMAIN: ${{ vars.GATEWAY_DOMAIN || 'flashmarket.shide.world' }}
      CATALOG_CORS_ORIGINS: ${{ vars.CATALOG_CORS_ORIGINS }}
      CATALOG_JWT_KEY_ID: ${{ vars.CATALOG_JWT_KEY_ID || 'flashmarket-catalog-ed25519-v1' }}
      DEPLOY_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DEPLOY_REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      DEPLOY_RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        shell: bash
        run: |
          DEPLOY_HOST="${DEPLOY_HOST:-176.108.242.100}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_USER="${DEPLOY_USER:-user1}"
          CATALOG_DOMAIN="catalog.${GATEWAY_DOMAIN}"
          INFRA_USER="${INFRA_USER:-shide}"
          : "${DEPLOY_POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
          : "${DEPLOY_REDIS_PASSWORD:?REDIS_PASSWORD is required}"
          : "${DEPLOY_RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"

          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::DEPLOY_HOST must be a hostname or IPv4 address"
            exit 1
          fi
          if [[ ! "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "::error::DEPLOY_USER is invalid"
            exit 1
          fi
          if [[ -z "$DEPLOY_PATH" ]]; then
            DEPLOY_PATH="/home/${DEPLOY_USER}/flashmarket-catalog"
            echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"
          fi
          : "${DEPLOY_PATH:?DEPLOY_PATH could not be derived}"
          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]] ||
            (( DEPLOY_PORT < 1 || DEPLOY_PORT > 65535 )); then
            echo "::error::DEPLOY_PORT must be between 1 and 65535"
            exit 1
          fi
          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::DEPLOY_PATH must be an absolute Unix path"
            exit 1
          fi
          if [[ ! "$CATALOG_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::CATALOG_DOMAIN must contain only a DNS hostname"
            exit 1
          fi
          if [[ ! "$INFRA_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "::error::INFRA_USER is invalid"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: bash scripts/configure-deploy-ssh.sh

      - name: Render production environment
        shell: bash
        run: |
          environment_file="$RUNNER_TEMP/flashmarket-catalog.env"
          cors_origins="${CATALOG_CORS_ORIGINS:-[\"https://${CATALOG_DOMAIN}\",\"https://${GATEWAY_DOMAIN}\"]}"
          umask 077
          {
            printf 'CATALOG_IMAGE=%s\n' "$CATALOG_IMAGE"
            printf 'CATALOG_PROXY_PORT=4919\n'
            printf 'CATALOG_ENVIRONMENT=production\n'
            printf 'CATALOG_DOMAIN=%s\n' "$CATALOG_DOMAIN"
            printf 'CATALOG_DATABASE_URL=postgresql+asyncpg://%s:%s@shide-postgres:5432/catalog\n' "$INFRA_USER" "$DEPLOY_POSTGRES_PASSWORD"
            printf 'CATALOG_REDIS_URL=redis://:%s@shide-redis:6379/1\n' "$DEPLOY_REDIS_PASSWORD"
            printf 'CATALOG_RABBITMQ_URL=amqp://%s:%s@shide-rabbitmq:5672/flashmarket\n' "$INFRA_USER" "$DEPLOY_RABBITMQ_PASSWORD"
            printf 'CATALOG_ALLOW_INSECURE_INTERNAL_SERVICES=true\n'
            printf 'CATALOG_JWT_KEYS_DIRECTORY=/var/lib/flashmarket-catalog/keys\n'
            printf 'CATALOG_JWT_KEY_ID=%s\n' "$CATALOG_JWT_KEY_ID"
            printf 'CATALOG_JWT_ISSUER=flashmarket-catalog\n'
            printf 'CATALOG_JWT_AUDIENCE=flashmarket-api\n'
            printf 'CATALOG_DEBUG=false\n'
            printf 'CATALOG_DOCS_ENABLED=false\n'
            printf 'CATALOG_RATE_LIMIT_ENABLED=true\n'
            printf 'CATALOG_CORS_ORIGINS=%s\n' "$cors_origins"
            printf 'CATALOG_TRUSTED_HOSTS=["%s","%s","*.%s","localhost","127.0.0.1","catalog","api"]\n' "$CATALOG_DOMAIN" "$GATEWAY_DOMAIN" "$GATEWAY_DOMAIN"
            printf 'CATALOG_TRUSTED_PROXY_IPS=["172.16.0.0/12"]\n'
            printf 'CATALOG_REFRESH_TOKEN_TRANSPORT=cookie\n'
            printf 'CATALOG_REFRESH_COOKIE_SECURE=true\n'
            printf 'CATALOG_REFRESH_COOKIE_NAME=__Host-flashmarket-refresh\n'
            printf 'CATALOG_CSRF_COOKIE_NAME=__Host-flashmarket-csrf\n'
            printf 'CATALOG_REFRESH_COOKIE_SAMESITE=strict\n'
            printf 'INFRA_USER=%s\n' "$INFRA_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$DEPLOY_POSTGRES_PASSWORD"
            printf 'REDIS_PASSWORD=%s\n' "$DEPLOY_REDIS_PASSWORD"
            printf 'RABBITMQ_PASSWORD=%s\n' "$DEPLOY_RABBITMQ_PASSWORD"
          } > "$environment_file"
          chmod 600 "$environment_file"

      - name: Upload deployment files
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -p "$DEPLOY_PORT" "$target" "mkdir -p '$DEPLOY_PATH'"
          scp -P "$DEPLOY_PORT" \
            catalog/docker-compose.deploy.yml \
            "$target:$DEPLOY_PATH/docker-compose.yml"
          scp -P "$DEPLOY_PORT" \
            catalog/nginx.conf.template \
            "$target:$DEPLOY_PATH/nginx.conf.template"
          ssh -p "$DEPLOY_PORT" "$target" \
            "umask 077; cat > '$DEPLOY_PATH/.env.next' && mv '$DEPLOY_PATH/.env.next' '$DEPLOY_PATH/.env'" \
            < "$RUNNER_TEMP/flashmarket-catalog.env"

      - name: Log server in to GHCR
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          printf '%s' "$GHCR_TOKEN" |
            ssh -p "$DEPLOY_PORT" "$target" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Deploy exact image digest
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -p "$DEPLOY_PORT" "$target" \
            "DEPLOY_PATH='$DEPLOY_PATH' CATALOG_IMAGE='$CATALOG_IMAGE' CATALOG_DOMAIN='$CATALOG_DOMAIN' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$DEPLOY_PATH"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          if [[ ! -f .env ]]; then
            echo "Missing $DEPLOY_PATH/.env"
            exit 1
          fi

          export CATALOG_IMAGE
          docker compose -f docker-compose.yml --env-file .env config --quiet
          docker compose -f docker-compose.yml --env-file .env pull

          wait_for_healthy() {
            service="$1"
            container="$(docker compose -f docker-compose.yml --env-file .env ps -q "$service")"
            for attempt in $(seq 1 60); do
              health="$(
                docker inspect \
                  --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                  "$container"
              )"
              if [[ "$health" == "healthy" ]]; then
                return 0
              fi
              if [[ "$health" == "unhealthy" || "$health" == "exited" ]]; then
                break
              fi
              sleep 2
            done
            docker compose -f docker-compose.yml --env-file .env logs --tail 100 "$service"
            return 1
          }

          echo 'Applying database migrations...'
          timeout 120 docker compose -f docker-compose.yml --env-file .env run --rm --no-deps api migrate </dev/null
          echo 'Database migrations complete.'

          echo 'Starting Catalog runtime containers...'
          docker compose -f docker-compose.yml --env-file .env up \
            -d \
            --no-build \
            --force-recreate \
            --remove-orphans \
            api nginx
          echo 'Catalog runtime containers started.'

          echo 'Waiting for Catalog API...'
          wait_for_healthy api
          echo 'Waiting for internal Nginx...'
          wait_for_healthy nginx
          docker compose -f docker-compose.yml --env-file .env ps -a
          echo 'Checking internal Nginx endpoint...'
          curl --fail --silent --show-error \
            http://127.0.0.1:4919/health/ready
          REMOTE

      - name: Verify public HTTPS endpoint
        shell: bash
        run: |
          if [[ -z "${CATALOG_DOMAIN:-}" ]]; then
            echo "CATALOG_DOMAIN is empty. Internal deployment succeeded."
            exit 0
          fi

          last_error=""
          for _ in $(seq 1 30); do
            if response="$(
              curl --fail --silent --show-error \
                "https://${CATALOG_DOMAIN}/health/ready" 2>&1
            )"; then
              printf '%s\n' "$response"
              exit 0
            fi
            last_error="$response"
            sleep 2
          done

          echo "::warning title=Public HTTPS check failed::Catalog API is not reachable through Nginx Proxy Manager at https://${CATALOG_DOMAIN}/health/ready"
          printf 'Last curl error: %s\n' "$last_error"

          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          if ssh -p "$DEPLOY_PORT" "$target" \
            "curl --fail --silent --show-error http://127.0.0.1:4919/health/ready"; then
            echo
            echo "::notice title=Catalog nginx is healthy::Configure Nginx Proxy Manager for ${CATALOG_DOMAIN} with upstream ${DEPLOY_HOST}:4919 and enable SSL"
            exit 0
          fi
          ssh -p "$DEPLOY_PORT" "$target" \
            "cd '$DEPLOY_PATH' && docker compose --env-file .env ps -a && ss -ltn '( sport = :4919 )' || true; docker compose --env-file .env logs --tail 100 api nginx"
          exit 1
