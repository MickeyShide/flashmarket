name: Gateway CI / Deploy

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - frontend/**
      - docs/architecture/**
      - gateway/**
      - tools/openapi/**
      - auth/src/**
      - auth/pyproject.toml
      - auth/uv.lock
      - catalog/src/**
      - catalog/pyproject.toml
      - catalog/uv.lock
      - inventory/src/**
      - inventory/pyproject.toml
      - inventory/uv.lock
      - orders/src/**
      - orders/pyproject.toml
      - orders/uv.lock
      - payments/src/**
      - payments/pyproject.toml
      - payments/uv.lock
      - notifications/src/**
      - notifications/pyproject.toml
      - notifications/uv.lock
      - wishlist/src/**
      - wishlist/pyproject.toml
      - wishlist/uv.lock
      - drops/src/**
      - drops/pyproject.toml
      - drops/uv.lock
      - media/src/**
      - media/pyproject.toml
      - media/uv.lock
      - shared/jwt_verifier/**
      - docker-compose.prod.yml
      - tests/test_gateway_routing.py
      - .github/workflows/gateway-deploy.yml
  push:
    branches:
      - develop
      - main
    paths:
      - frontend/**
      - docs/architecture/**
      - gateway/**
      - tools/openapi/**
      - auth/src/**
      - auth/pyproject.toml
      - auth/uv.lock
      - catalog/src/**
      - catalog/pyproject.toml
      - catalog/uv.lock
      - inventory/src/**
      - inventory/pyproject.toml
      - inventory/uv.lock
      - orders/src/**
      - orders/pyproject.toml
      - orders/uv.lock
      - payments/src/**
      - payments/pyproject.toml
      - payments/uv.lock
      - notifications/src/**
      - notifications/pyproject.toml
      - notifications/uv.lock
      - wishlist/src/**
      - wishlist/pyproject.toml
      - wishlist/uv.lock
      - drops/src/**
      - drops/pyproject.toml
      - drops/uv.lock
      - media/src/**
      - media/pyproject.toml
      - media/uv.lock
      - shared/jwt_verifier/**
      - docker-compose.prod.yml
      - tests/test_gateway_routing.py
      - .github/workflows/gateway-deploy.yml
  workflow_dispatch:

concurrency:
  group: gateway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"
  IMAGE_NAME: ghcr.io/mickeyshide/flashmarket-frontend

jobs:
  image:
    name: Build frontend image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Generate public API contract
        run: python tools/openapi/generate.py

      - name: Verify OpenAPI and gateway contracts
        run: uv run --project payments pytest tests/test_openapi_generation.py tests/test_gateway_routing.py

      - name: Reject Developer Hub mock artifacts
        shell: bash
        run: |
          if rg -n "mockApiData|Mock Runtime|LIVE MOCK|mock_token|flashmarket\.dev" frontend/src/components/DevHub; then
            echo "::error::Developer Hub contains mock or hard-coded production data"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=flashmarket-frontend
          cache-to: type=gha,mode=max,scope=flashmarket-frontend

  deploy:
    name: Deploy gateway
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    needs:
      - image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '176.108.242.100' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'user1' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USERNAME: ${{ github.actor }}
      FRONTEND_IMAGE: ghcr.io/mickeyshide/flashmarket-frontend@${{ needs.image.outputs.digest }}
      GATEWAY_DOMAIN: ${{ vars.GATEWAY_DOMAIN || 'flashmarket.shide.world' }}
      GATEWAY_PORT: ${{ vars.GATEWAY_PORT || '8080' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        shell: bash
        run: |
          DEPLOY_HOST="${DEPLOY_HOST:-176.108.242.100}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_USER="${DEPLOY_USER:-user1}"
          GATEWAY_DOMAIN="${GATEWAY_DOMAIN:-flashmarket.shide.world}"

          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::DEPLOY_HOST must be a hostname or IPv4 address"
            exit 1
          fi
          if [[ -z "$DEPLOY_PATH" ]]; then
            DEPLOY_PATH="/home/${DEPLOY_USER}/flashmarket-gateway"
            echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"
          fi
          : "${DEPLOY_PATH:?DEPLOY_PATH could not be derived}"
          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]] ||
            (( DEPLOY_PORT < 1 || DEPLOY_PORT > 65535 )); then
            echo "::error::DEPLOY_PORT must be between 1 and 65535"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: bash scripts/configure-deploy-ssh.sh

      - name: Render production environment
        shell: bash
        run: |
          environment_file="$RUNNER_TEMP/flashmarket-gateway.env"
          {
            printf 'FRONTEND_IMAGE=%s\n' "$FRONTEND_IMAGE"
            printf 'GATEWAY_PORT=%s\n' "$GATEWAY_PORT"
            printf 'GATEWAY_DOMAIN=%s\n' "$GATEWAY_DOMAIN"
          } > "$environment_file"
          chmod 600 "$environment_file"

      - name: Upload deployment files
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -p "$DEPLOY_PORT" "$target" "mkdir -p '$DEPLOY_PATH'"
          ssh -p "$DEPLOY_PORT" "$target" "
            if [ -d '$DEPLOY_PATH/nginx.conf' ]; then
              sudo rm -rf '$DEPLOY_PATH/nginx.conf' 2>/dev/null || \
              docker run --rm -v '$DEPLOY_PATH:/work' nginx:1.30-alpine rm -rf /work/nginx.conf 2>/dev/null || \
              rm -rf '$DEPLOY_PATH/nginx.conf' || true
            fi
            if [ -e '$DEPLOY_PATH/gateway' ]; then
              sudo rm -rf '$DEPLOY_PATH/gateway' 2>/dev/null || \
              docker run --rm -v '$DEPLOY_PATH:/work' nginx:1.30-alpine rm -rf /work/gateway 2>/dev/null || \
              rm -rf '$DEPLOY_PATH/gateway' || true
            fi
          "
          scp -P "$DEPLOY_PORT" \
            docker-compose.prod.yml \
            "$target:$DEPLOY_PATH/docker-compose.yml"
          scp -P "$DEPLOY_PORT" \
            gateway/nginx.conf \
            gateway/yookassa-allowlist.conf \
            "$target:$DEPLOY_PATH/"
          ssh -p "$DEPLOY_PORT" "$target" \
            "umask 077; cat > '$DEPLOY_PATH/.env.next' && mv '$DEPLOY_PATH/.env.next' '$DEPLOY_PATH/.env'" \
            < "$RUNNER_TEMP/flashmarket-gateway.env"

      - name: Log server in to GHCR
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          docker_config="${DEPLOY_PATH}/.docker-gateway"
          ssh -p "$DEPLOY_PORT" "$target" "install -d -m 700 '$docker_config'"
          printf '%s' "$GHCR_TOKEN" |
            ssh -p "$DEPLOY_PORT" "$target" \
              "DOCKER_CONFIG='$docker_config' docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Deploy gateway and frontend
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -p "$DEPLOY_PORT" "$target" \
            "DEPLOY_PATH='$DEPLOY_PATH' FRONTEND_IMAGE='$FRONTEND_IMAGE' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          exec 9>/tmp/flashmarket-production-deploy.lock
          flock -w 1800 9
          cd "$DEPLOY_PATH"
          export DOCKER_CONFIG="$DEPLOY_PATH/.docker-gateway"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -f -- "$DOCKER_CONFIG/config.json"; rmdir -- "$DOCKER_CONFIG" 2>/dev/null || true' EXIT

          if [[ ! -f .env ]]; then
            echo "Missing $DEPLOY_PATH/.env"
            exit 1
          fi

          export FRONTEND_IMAGE
          docker compose -f docker-compose.yml --env-file .env config --quiet
          docker compose -f docker-compose.yml --env-file .env pull
          docker compose -f docker-compose.yml --env-file .env up -d --no-build --force-recreate gateway frontend

          echo 'Waiting for gateway...'
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.yml --env-file .env exec -T gateway wget -q -O /dev/null http://localhost/health; then
              echo 'Gateway is healthy'
              break
            fi
            sleep 2
          done

          docker compose -f docker-compose.yml --env-file .env ps -a
          echo 'Checking gateway upstream...'
          curl --fail --silent --show-error \
            -H "Host: ${GATEWAY_DOMAIN}" \
            "http://127.0.0.1:${GATEWAY_PORT}/health"
          REMOTE

      - name: Verify public HTTPS endpoint
        shell: bash
        run: |
          if [[ -z "${GATEWAY_DOMAIN:-}" ]]; then
            echo "GATEWAY_DOMAIN is empty. Internal deployment succeeded."
            exit 0
          fi

          last_error=""
          for _ in $(seq 1 30); do
            if response="$(
              curl --fail --silent --show-error \
                "https://${GATEWAY_DOMAIN}/health" 2>&1
            )"; then
              printf '%s\n' "$response"
              curl --fail --silent --show-error \
                "https://${GATEWAY_DOMAIN}/dev" > /dev/null
              curl --fail --silent --show-error \
                "https://${GATEWAY_DOMAIN}/dev/openapi.json" > /dev/null
              exit 0
            fi
            last_error="$response"
            sleep 2
          done

          echo "::warning title=Public HTTPS check failed::Gateway is not reachable through Nginx Proxy Manager at https://${GATEWAY_DOMAIN}/health"
          printf 'Last curl error: %s\n' "$last_error"

          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          if ssh -p "$DEPLOY_PORT" "$target" \
            "curl --fail --silent --show-error http://127.0.0.1:${GATEWAY_PORT}/health"; then
            echo
            echo "::notice title=Gateway nginx is healthy::Configure Nginx Proxy Manager for ${GATEWAY_DOMAIN} with upstream ${DEPLOY_HOST}:${GATEWAY_PORT} and enable SSL"
            exit 0
          fi
          ssh -p "$DEPLOY_PORT" "$target" \
            "cd '$DEPLOY_PATH' && docker compose --env-file .env ps -a && ss -ltn '( sport = :${GATEWAY_PORT} )' || true; docker compose --env-file .env logs --tail 100 gateway"
          exit 1
