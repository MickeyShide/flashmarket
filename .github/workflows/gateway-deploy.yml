name: Gateway CI / Deploy

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - frontend/**
      - gateway/**
      - docker-compose.prod.yml
      - .github/workflows/gateway-deploy.yml
  push:
    branches:
      - develop
      - main
    paths:
      - frontend/**
      - gateway/**
      - docker-compose.prod.yml
      - .github/workflows/gateway-deploy.yml
  workflow_dispatch:

concurrency:
  group: gateway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"
  IMAGE_NAME: ghcr.io/mickeyshide/flashmarket-frontend

jobs:
  image:
    name: Build frontend image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=flashmarket-frontend
          cache-to: type=gha,mode=max,scope=flashmarket-frontend

  deploy:
    name: Deploy gateway
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    needs:
      - image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '176.108.242.100' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'user1' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USERNAME: ${{ github.actor }}
      FRONTEND_IMAGE: ghcr.io/mickeyshide/flashmarket-frontend@${{ needs.image.outputs.digest }}
      GATEWAY_DOMAIN: ${{ vars.GATEWAY_DOMAIN || 'flashmarket.shide.world' }}
      GATEWAY_PORT: ${{ vars.GATEWAY_PORT || '8080' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        shell: bash
        run: |
          DEPLOY_HOST="${DEPLOY_HOST:-176.108.242.100}"
          DEPLOY_USER="${DEPLOY_USER:-user1}"
          GATEWAY_DOMAIN="${GATEWAY_DOMAIN:-flashmarket.shide.world}"

          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::DEPLOY_HOST must be a hostname or IPv4 address"
            exit 1
          fi
          if [[ -z "$DEPLOY_PATH" ]]; then
            DEPLOY_PATH="/home/${DEPLOY_USER}/flashmarket-gateway"
            echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"
          fi
          : "${DEPLOY_PATH:?DEPLOY_PATH could not be derived}"
          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]] ||
            (( DEPLOY_PORT < 1 || DEPLOY_PORT > 65535 )); then
            echo "::error::DEPLOY_PORT must be between 1 and 65535"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host *
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Render production environment
        shell: bash
        run: |
          environment_file="$RUNNER_TEMP/flashmarket-gateway.env"
          {
            printf 'FRONTEND_IMAGE=%s\n' "$FRONTEND_IMAGE"
            printf 'GATEWAY_PORT=%s\n' "$GATEWAY_PORT"
            printf 'GATEWAY_DOMAIN=%s\n' "$GATEWAY_DOMAIN"
          } > "$environment_file"
          chmod 600 "$environment_file"

      - name: Upload deployment files
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -p "$DEPLOY_PORT" "$target" "mkdir -p '$DEPLOY_PATH/gateway'"
          ssh -p "$DEPLOY_PORT" "$target" "
            [ -d '$DEPLOY_PATH/nginx.conf' ] && rm -rf '$DEPLOY_PATH/nginx.conf' || true;
            [ -d '$DEPLOY_PATH/gateway/nginx.conf' ] && rm -rf '$DEPLOY_PATH/gateway/nginx.conf' || true
          "
          scp -P "$DEPLOY_PORT" \
            docker-compose.prod.yml \
            "$target:$DEPLOY_PATH/docker-compose.yml"
          scp -P "$DEPLOY_PORT" \
            gateway/nginx.conf \
            "$target:$DEPLOY_PATH/nginx.conf"
          scp -P "$DEPLOY_PORT" \
            gateway/nginx.conf \
            "$target:$DEPLOY_PATH/gateway/nginx.conf"
          ssh -p "$DEPLOY_PORT" "$target" \
            "umask 077; cat > '$DEPLOY_PATH/.env.next' && mv '$DEPLOY_PATH/.env.next' '$DEPLOY_PATH/.env'" \
            < "$RUNNER_TEMP/flashmarket-gateway.env"

      - name: Log server in to GHCR
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          printf '%s' "$GHCR_TOKEN" |
            ssh -p "$DEPLOY_PORT" "$target" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Deploy gateway and frontend
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -p "$DEPLOY_PORT" "$target" \
            "DEPLOY_PATH='$DEPLOY_PATH' FRONTEND_IMAGE='$FRONTEND_IMAGE' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$DEPLOY_PATH"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          if [[ ! -f .env ]]; then
            echo "Missing $DEPLOY_PATH/.env"
            exit 1
          fi

          export FRONTEND_IMAGE
          docker compose -f docker-compose.yml --env-file .env config --quiet
          docker compose -f docker-compose.yml --env-file .env pull
          docker compose -f docker-compose.yml --env-file .env up -d --no-build --force-recreate gateway frontend

          echo 'Waiting for gateway...'
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.yml --env-file .env exec -T gateway wget -q -O /dev/null http://localhost/health; then
              echo 'Gateway is healthy'
              break
            fi
            sleep 2
          done

          docker compose -f docker-compose.yml --env-file .env ps -a
          echo 'Checking gateway upstream...'
          curl --fail --silent --show-error \
            -H "Host: ${GATEWAY_DOMAIN}" \
            "http://127.0.0.1:${GATEWAY_PORT}/health"
          REMOTE

      - name: Verify public endpoint
        shell: bash
        run: |
          last_error=""
          for _ in $(seq 1 30); do
            if response="$(
              curl --fail --silent --show-error \
                "https://${GATEWAY_DOMAIN}/health" 2>&1
            )"; then
              printf '%s\n' "$response"
              exit 0
            fi
            last_error="$response"
            sleep 2
          done

          echo "::error title=Public HTTPS check failed::Gateway is not reachable at https://${GATEWAY_DOMAIN}/health"
          printf 'Last curl error: %s\n' "$last_error"
          exit 1
