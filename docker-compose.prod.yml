name: flashmarket-gateway

services:
  gateway:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-_}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - shide-observability

  frontend:
    image: ${FRONTEND_IMAGE:-flashmarket-frontend:local}
    pull_policy: always
    environment:
      - NODE_ENV=production
    networks:
      shide-observability:
        aliases:
          - frontend
    restart: unless-stopped

networks:
  shide-observability:
    external: true
