name: flashmarket-gateway

services:
  gateway:
    image: nginx:1.30-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-_}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-64m}
    mem_reservation: ${GATEWAY_MEMORY_RESERVATION:-16m}
    pids_limit: ${GATEWAY_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 10s
    logging: &bounded-logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    networks:
      - shide-observability

  frontend:
    image: ${FRONTEND_IMAGE:-flashmarket-frontend:local}
    pull_policy: always
    environment:
      - NODE_ENV=production
    networks:
      shide-observability:
        aliases:
          - frontend
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-48m}
    mem_reservation: ${FRONTEND_MEMORY_RESERVATION:-12m}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-32}
    init: true
    stop_grace_period: 10s
    logging: *bounded-logging

networks:
  shide-observability:
    external: true
