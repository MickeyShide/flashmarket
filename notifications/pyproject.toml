[project]
name = "flashmarket-notifications"
version = "0.1.0"
description = "Notification delivery service for FlashMarket"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18,<2",
    "asyncpg>=0.31,<1",
    "fastapi>=0.140,<1",
    "pydantic-settings>=2.14,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.51,<1",
    "aio-pika>=9.5,<10",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22,<1",
    "httpx>=0.28,<1",
    "mypy>=2.1,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifications"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.14"
files = ["src/notifications"]
plugins = ["pydantic.mypy"]
strict = true
pretty = true
show_error_codes = true
show_error_context = true
warn_unreachable = true
