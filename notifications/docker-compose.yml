name: flashmarket-notifications

x-notifications-runtime: &notifications-runtime
  image: flashmarket-notifications-api:local
  pull_policy: never

x-notifications-environment: &notifications-environment
  NOTIFICATIONS_ENVIRONMENT: development
  NOTIFICATIONS_DATABASE_URL: postgresql+asyncpg://${INFRA_USER:-shide}:${POSTGRES_PASSWORD:-shide}@shide-postgres:5432/notifications
  NOTIFICATIONS_RABBITMQ_URL: amqp://${INFRA_USER:-shide}:${RABBITMQ_PASSWORD:-shide}@shide-rabbitmq:5672/flashmarket
  NOTIFICATIONS_CORS_ORIGINS: '["http://localhost:3000"]'
  NOTIFICATIONS_LOG_FILE_PATH: /var/log/shide/notifications-api.log
  NOTIFICATIONS_PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
  NOTIFICATIONS_ALLOW_INSECURE_INTERNAL_SERVICES: 'true'
  NOTIFICATIONS_JWT_PUBLIC_KEY_DIR: /var/lib/flashmarket/keys/public
  NOTIFICATIONS_JWT_ALGORITHM: EdDSA
  NOTIFICATIONS_JWT_ISSUER: flashmarket-auth
  NOTIFICATIONS_JWT_AUDIENCE: flashmarket-api

services:
  api:
    <<: *notifications-runtime
    build:
      context: ..
      dockerfile: notifications/Dockerfile
    environment: *notifications-environment
    ports:
      - "127.0.0.1:${NOTIFICATIONS_PORT:-4922}:8000"
    volumes:
      - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro
      - backend-logs-local:/var/log/shide
      - notifications-metrics-data:/tmp/prometheus
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  consumer:
    <<: *notifications-runtime
    environment:
      <<: *notifications-environment
      NOTIFICATIONS_LOG_FILE_PATH: /var/log/shide/notifications-consumer.log
    command:
      - consumer
      - notifications.event_consumer
    volumes:
      - backend-logs-local:/var/log/shide
    restart: unless-stopped

  outbox:
    <<: *notifications-runtime
    environment:
      <<: *notifications-environment
      NOTIFICATIONS_LOG_FILE_PATH: /var/log/shide/notifications-outbox.log
    command:
      - outbox
      - notifications.outbox_worker
    volumes:
      - backend-logs-local:/var/log/shide
    restart: unless-stopped

volumes:
  notifications-metrics-data:
  backend-logs-local:
    external: true
    name: shide-backend-logs-local

networks:
  default:
    name: shide-observability
    external: true
