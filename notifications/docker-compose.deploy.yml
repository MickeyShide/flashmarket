name: flashmarket-notifications

x-notifications-runtime: &notifications-runtime
  image: ${NOTIFICATIONS_IMAGE:-flashmarket-notifications-api:local}
  pull_policy: always
  env_file:
    - ${NOTIFICATIONS_ENV_FILE:-.env}
  networks:
    backend:
      aliases:
        - notifications

x-notifications-environment: &notifications-environment
  NOTIFICATIONS_ENVIRONMENT: ${NOTIFICATIONS_ENVIRONMENT:-production}
  NOTIFICATIONS_DATABASE_URL: ${NOTIFICATIONS_DATABASE_URL}
  NOTIFICATIONS_RABBITMQ_URL: ${NOTIFICATIONS_RABBITMQ_URL}
  NOTIFICATIONS_CORS_ORIGINS: ${NOTIFICATIONS_CORS_ORIGINS:-[]}
  NOTIFICATIONS_TRUSTED_HOSTS: ${NOTIFICATIONS_TRUSTED_HOSTS}
  NOTIFICATIONS_DOCS_ENABLED: ${NOTIFICATIONS_DOCS_ENABLED:-false}
  NOTIFICATIONS_DEBUG: ${NOTIFICATIONS_DEBUG:-false}
  NOTIFICATIONS_ALLOW_INSECURE_INTERNAL_SERVICES: ${NOTIFICATIONS_ALLOW_INSECURE_INTERNAL_SERVICES:-false}
  NOTIFICATIONS_JWT_PUBLIC_KEY_DIR: /var/lib/flashmarket/keys/public
  NOTIFICATIONS_JWT_ALGORITHM: EdDSA
  NOTIFICATIONS_JWT_ISSUER: flashmarket-auth
  NOTIFICATIONS_JWT_AUDIENCE: flashmarket-api

services:
  api:
    <<: *notifications-runtime
    mem_limit: ${NOTIFICATIONS_API_MEMORY_LIMIT:-192m}
    mem_reservation: ${NOTIFICATIONS_API_MEMORY_RESERVATION:-72m}
    pids_limit: ${NOTIFICATIONS_API_PIDS_LIMIT:-96}
    init: true
    stop_grace_period: 20s
    logging: &bounded-logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    environment: *notifications-environment
    volumes:
      - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro
    depends_on: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  consumer:
    <<: *notifications-runtime
    mem_limit: ${NOTIFICATIONS_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${NOTIFICATIONS_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${NOTIFICATIONS_WORKER_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 20s
    logging: *bounded-logging
    environment: *notifications-environment
    command:
      - consumer
      - notifications.event_consumer
    depends_on: {}
    restart: unless-stopped
    healthcheck: &worker-health
      test: ["CMD", "python", "-m", "rabbitmq_reliability.heartbeat", "/tmp/flashmarket-heartbeat.json", "45"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 45s

  outbox:
    <<: *notifications-runtime
    mem_limit: ${NOTIFICATIONS_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${NOTIFICATIONS_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${NOTIFICATIONS_WORKER_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 20s
    logging: *bounded-logging
    environment: *notifications-environment
    command:
      - outbox
      - notifications.outbox_worker
    depends_on: {}
    restart: unless-stopped
    healthcheck: *worker-health

  nginx:
    image: nginx:1.30-alpine
    env_file:
      - ${NOTIFICATIONS_ENV_FILE:-.env}
    ports:
      - "${NOTIFICATIONS_PROXY_PORT:-4922}:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - frontend
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    mem_limit: ${NOTIFICATIONS_NGINX_MEMORY_LIMIT:-32m}
    mem_reservation: ${NOTIFICATIONS_NGINX_MEMORY_RESERVATION:-8m}
    pids_limit: ${NOTIFICATIONS_NGINX_PIDS_LIMIT:-32}
    init: true
    stop_grace_period: 10s
    logging: *bounded-logging

networks:
  frontend:
    external: true
    name: shide-observability
  backend:
    external: true
    name: shide-observability

volumes:
  auth-jwt-keys-public:
    external: true
    name: flashmarket-auth-jwt-keys-public
