[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jwt_verifier"
version = "0.1.3"
description = "Verification-only JWT package for FlashMarket downstream services"
dependencies = [
    "pyjwt>=2.8.0",
    "cryptography>=50,<51",
    "fastapi>=0.110.0",
]

[tool.hatch.build.targets.wheel]
packages = ["jwt_verifier"]
