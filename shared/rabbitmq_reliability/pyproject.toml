[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rabbitmq_reliability"
version = "0.1.0"
description = "Shared RabbitMQ delivery reliability helpers for FlashMarket"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=9.5,<11",
    "prometheus-client>=0.26,<1",
    "sqlalchemy>=2.0.47,<3",
]

[project.scripts]
flashmarket-dlq = "rabbitmq_reliability.dlq:main"

[dependency-groups]
dev = [
    "mypy>=2.1,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["rabbitmq_reliability"]

[tool.hatch.build.targets.wheel.force-include]
"rabbitmq_reliability/py.typed" = "rabbitmq_reliability/py.typed"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a live RabbitMQ broker"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
files = ["rabbitmq_reliability"]
strict = true
