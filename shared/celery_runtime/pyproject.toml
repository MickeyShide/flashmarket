[project]
name = "flashmarket-celery-runtime"
version = "0.1.0"
description = "Shared Celery runtime for FlashMarket maintenance jobs"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6,<6",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flashmarket_celery"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]
