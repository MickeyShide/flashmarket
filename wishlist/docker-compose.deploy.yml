name: flashmarket-wishlist

x-wishlist-runtime: &wishlist-runtime
  image: ${WISHLIST_IMAGE:?WISHLIST_IMAGE must contain the image digest}
  pull_policy: always
  env_file:
    - ${WISHLIST_ENV_FILE:-.env}
  networks:
    backend:
      aliases:
        - wishlist
  volumes:
    - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro

services:
  api:
    <<: *wishlist-runtime
    mem_limit: ${WISHLIST_API_MEMORY_LIMIT:-192m}
    mem_reservation: ${WISHLIST_API_MEMORY_RESERVATION:-72m}
    pids_limit: ${WISHLIST_API_PIDS_LIMIT:-96}
    init: true
    stop_grace_period: 20s
    logging: &bounded-logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  consumer:
    <<: *wishlist-runtime
    mem_limit: ${WISHLIST_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${WISHLIST_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${WISHLIST_WORKER_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 20s
    logging: *bounded-logging
    networks:
      backend:
        aliases: [wishlist-consumer]
    command:
      - consumer
      - wishlist.event_consumer
    restart: unless-stopped
    labels:
      flashmarket.autoheal: "true"
    healthcheck: &worker-health
      test: ["CMD-SHELL", "python -m rabbitmq_reliability.heartbeat /tmp/flashmarket-heartbeat.json $${WISHLIST_WORKER_HEARTBEAT_STALE_SECONDS:-45}"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 45s

  outbox:
    <<: *wishlist-runtime
    mem_limit: ${WISHLIST_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${WISHLIST_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${WISHLIST_WORKER_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 20s
    logging: *bounded-logging
    networks:
      backend:
        aliases: [wishlist-outbox]
    command:
      - outbox
      - wishlist.outbox_worker
    restart: unless-stopped
    labels:
      flashmarket.autoheal: "true"
    healthcheck: *worker-health

networks:
  backend:
    external: true
    name: shide-observability

volumes:
  auth-jwt-keys-public:
    external: true
    name: flashmarket-auth-jwt-keys-public
