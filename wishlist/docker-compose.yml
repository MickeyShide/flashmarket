name: flashmarket-wishlist

x-wishlist-runtime: &wishlist-runtime
  image: flashmarket-wishlist-api:local
  pull_policy: never
  init: true
  stop_grace_period: 20s
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

x-wishlist-environment: &wishlist-environment
  WISHLIST_ENVIRONMENT: development
  WISHLIST_DATABASE_URL: postgresql+asyncpg://${INFRA_USER:-shide}:${POSTGRES_PASSWORD:-shide}@shide-postgres:5432/wishlist
  WISHLIST_CORS_ORIGINS: '["http://localhost:3000"]'
  WISHLIST_TRUSTED_HOSTS: '["localhost","127.0.0.1","wishlist","gateway"]'
  WISHLIST_LOG_FILE_PATH: /var/log/shide/wishlist-api.log
  WISHLIST_ALLOW_INSECURE_INTERNAL_SERVICES: 'true'
  WISHLIST_RABBITMQ_URL: amqp://${INFRA_USER:-shide}:${RABBITMQ_PASSWORD:-shide}@shide-rabbitmq:5672/flashmarket
  WISHLIST_JWT_PUBLIC_KEY_DIR: /var/lib/flashmarket/keys/public
  WISHLIST_JWT_ALGORITHM: EdDSA
  WISHLIST_JWT_ISSUER: flashmarket-auth
  WISHLIST_JWT_AUDIENCE: flashmarket-api

services:
  api:
    <<: *wishlist-runtime
    build:
      context: ..
      dockerfile: wishlist/Dockerfile
    environment: *wishlist-environment
    ports:
      - "127.0.0.1:${WISHLIST_PORT:-4924}:8000"
    volumes:
      - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro
      - backend-logs-local:/var/log/shide
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    mem_limit: ${WISHLIST_API_MEMORY_LIMIT:-192m}
    mem_reservation: ${WISHLIST_API_MEMORY_RESERVATION:-72m}
    pids_limit: ${WISHLIST_API_PIDS_LIMIT:-96}

  consumer:
    <<: *wishlist-runtime
    environment:
      <<: *wishlist-environment
      WISHLIST_LOG_FILE_PATH: /var/log/shide/wishlist-consumer.log
    command:
      - consumer
      - wishlist.event_consumer
    volumes:
      - backend-logs-local:/var/log/shide
    restart: unless-stopped
    mem_limit: ${WISHLIST_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${WISHLIST_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${WISHLIST_WORKER_PIDS_LIMIT:-64}

volumes:
  auth-jwt-keys-public:
  backend-logs-local:
    external: true
    name: shide-backend-logs-local

networks:
  default:
    name: shide-observability
    external: true
