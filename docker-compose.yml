      NOTIFICATIONS_RABBITMQ_URL: amqp://flashmarket:flashmarket@rabbitmq:5672/

  # -----------------------------------------------------------
  # GATEWAY & FRONTEND
  # -----------------------------------------------------------
  gateway:
    extends:
      file: gateway/docker-compose.yml
      service: nginx

  frontend:
    extends:
      file: frontend/docker-compose.yml
      service: frontend

volumes:
  auth-jwt-keys:
  auth-postgres-data:
  catalog-postgres-data:
  inventory-postgres-data:
  orders-postgres-data:
  payments-postgres-data:
  notifications-postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  default:
    name: flashmarket
    external: true
