    depends_on: !reset {}
    environment:
      ORDERS_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@orders-db:5432/orders

  orders-db:
    extends:
      file: orders/docker-compose.yml
      service: db

  orders-consumer:
    extends:
      file: orders/docker-compose.yml
      service: consumer
    depends_on: !reset {}
    environment:
