      service: frontend

volumes:
  auth-jwt-keys:
  auth-postgres-data:
  auth-rabbitmq-data:
  auth-redis-data:
  catalog-postgres-data:
  inventory-postgres-data:
  inventory-rabbitmq-data:
  orders-postgres-data:
  orders-rabbitmq-data:
  payments-postgres-data:
  payments-rabbitmq-data:
