      PAYMENTS_RABBITMQ_URL: amqp://flashmarket:flashmarket@rabbitmq:5672/

  # -----------------------------------------------------------
  # NOTIFICATIONS MICROSERVICE
  # -----------------------------------------------------------
  notifications:
    extends:
      file: notifications/docker-compose.yml
      service: api
    depends_on: !reset {}
    environment:
      NOTIFICATIONS_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@notifications-db:5432/notifications
