name: flashmarket

services:
  # -----------------------------------------------------------
  # AUTH MICROSERVICE
  # -----------------------------------------------------------
  auth-keygen:
    extends:
      file: auth/docker-compose.yml
      service: keygen

  auth:
    extends:
      file: auth/docker-compose.yml
      service: api
    depends_on: !override
      auth-keygen:
        condition: service_completed_successfully

  auth-outbox:
    extends:
      file: auth/docker-compose.yml
      service: outbox
    depends_on: !reset {}

  auth-cleanup:
    extends:
      file: auth/docker-compose.yml
      service: cleanup
    depends_on: !reset {}

  # -----------------------------------------------------------
  # CATALOG MICROSERVICE
  # -----------------------------------------------------------
  catalog:
    extends:
      file: catalog/docker-compose.yml
      service: api
    depends_on:
      auth-keygen:
        condition: service_completed_successfully

  # -----------------------------------------------------------
  # INVENTORY MICROSERVICE
  # -----------------------------------------------------------
  inventory:
    extends:
      file: inventory/docker-compose.yml
      service: api
    depends_on:
      auth-keygen:
        condition: service_completed_successfully

  inventory-consumer:
    extends:
      file: inventory/docker-compose.yml
      service: consumer
    depends_on: !reset {}

  inventory-outbox:
    extends:
      file: inventory/docker-compose.yml
      service: outbox
    depends_on: !reset {}

  inventory-expiry:
    extends:
      file: inventory/docker-compose.yml
      service: expiry
    depends_on: !reset {}

  # -----------------------------------------------------------
  # ORDERS MICROSERVICE
  # -----------------------------------------------------------
  orders:
    extends:
      file: orders/docker-compose.yml
      service: api
    depends_on:
      auth-keygen:
        condition: service_completed_successfully

  orders-consumer:
    extends:
      file: orders/docker-compose.yml
      service: consumer
    depends_on: !reset {}

  orders-outbox:
    extends:
      file: orders/docker-compose.yml
      service: outbox
    depends_on: !reset {}

  # -----------------------------------------------------------
  # PAYMENTS MICROSERVICE
  # -----------------------------------------------------------
  payments:
    extends:
      file: payments/docker-compose.yml
      service: api
    depends_on:
      auth-keygen:
        condition: service_completed_successfully

  payments-consumer:
    extends:
      file: payments/docker-compose.yml
      service: consumer
    depends_on: !reset {}

  payments-outbox:
    extends:
      file: payments/docker-compose.yml
      service: outbox
    depends_on: !reset {}

  # -----------------------------------------------------------
  # NOTIFICATIONS MICROSERVICE
  # -----------------------------------------------------------
  notifications:
    extends:
      file: notifications/docker-compose.yml
      service: api
    depends_on:
      auth-keygen:
        condition: service_completed_successfully

  notifications-consumer:
    extends:
      file: notifications/docker-compose.yml
      service: consumer
    depends_on: !reset {}

  notifications-outbox:
    extends:
      file: notifications/docker-compose.yml
      service: outbox
    depends_on: !reset {}

  # -----------------------------------------------------------
  # WISHLIST MICROSERVICE
  # -----------------------------------------------------------
  wishlist:
    extends:
      file: wishlist/docker-compose.yml
      service: api
    depends_on:
      auth-keygen:
        condition: service_completed_successfully

  wishlist-consumer:
    extends:
      file: wishlist/docker-compose.yml
      service: consumer
    depends_on: !reset {}

  wishlist-outbox:
    extends:
      file: wishlist/docker-compose.yml
      service: outbox
    depends_on: !reset {}

  # -----------------------------------------------------------
  # DROPS MICROSERVICE
  # -----------------------------------------------------------
  drops:
    extends:
      file: drops/docker-compose.yml
      service: api
    depends_on:
      auth-keygen:
        condition: service_completed_successfully

  drops-scheduler:
    extends:
      file: drops/docker-compose.yml
      service: scheduler
    depends_on: !reset {}

  drops-outbox:
    extends:
      file: drops/docker-compose.yml
      service: outbox
    depends_on: !reset {}

  # -----------------------------------------------------------
  # MEDIA MICROSERVICE
  # Uses the existing S3/MinIO instance on shide-observability.
  # -----------------------------------------------------------
  media:
    extends:
      file: media/docker-compose.yml
      service: api
    depends_on:
      auth-keygen:
        condition: service_completed_successfully

  media-cleanup:
    extends:
      file: media/docker-compose.yml
      service: cleanup
    depends_on: !reset {}

  # -----------------------------------------------------------
  # GATEWAY & FRONTEND
  # -----------------------------------------------------------
  gateway:
    extends:
      file: gateway/docker-compose.yml
      service: nginx

  gateway-exporter:
    extends:
      file: gateway/docker-compose.yml
      service: nginx-exporter
    depends_on: !override
      gateway:
        condition: service_started

  frontend:
    extends:
      file: frontend/docker-compose.yml
      service: frontend

networks:
  default:
    name: shide-observability
    external: true
  shide-observability:
    external: true

volumes:
  frontend-node-modules:
  auth-jwt-keys-private:
  auth-jwt-keys-public:
  auth-metrics-data:
  catalog-metrics-data:
  inventory-metrics-data:
  orders-metrics-data:
  payments-metrics-data:
  notifications-metrics-data:
  backend-logs-local:
    external: true
    name: shide-backend-logs-local
