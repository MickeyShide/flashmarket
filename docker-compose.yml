name: flashmarket

services:
  # -----------------------------------------------------------
  # SHARED INFRASTRUCTURE (Single Redis & Single RabbitMQ)
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: flashmarket-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: flashmarket-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: flashmarket
      RABBITMQ_DEFAULT_PASS: flashmarket
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # -----------------------------------------------------------
  # AUTH MICROSERVICE
  # -----------------------------------------------------------
  auth:
    extends:
      file: auth/docker-compose.yml
      service: api
    depends_on: !reset {}
    environment:
      AUTH_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@auth-db:5432/auth
      AUTH_REDIS_URL: redis://redis:6379/0
      AUTH_RABBITMQ_URL: amqp://flashmarket:flashmarket@rabbitmq:5672/
    volumes:
      - auth-jwt-keys:/var/lib/flashmarket-auth/keys:ro

  auth-migrate:
    extends:
      file: auth/docker-compose.yml
      service: migrate
    depends_on: !reset {}
    environment:
      AUTH_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@auth-db:5432/auth

  auth-db:
    extends:
      file: auth/docker-compose.yml
      service: db

  auth-outbox:
    extends:
      file: auth/docker-compose.yml
      service: outbox
    depends_on: !reset {}
    environment:
      AUTH_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@auth-db:5432/auth
      AUTH_REDIS_URL: redis://redis:6379/0
      AUTH_RABBITMQ_URL: amqp://flashmarket:flashmarket@rabbitmq:5672/

  # -----------------------------------------------------------
  # CATALOG MICROSERVICE
  # -----------------------------------------------------------
  catalog:
    extends:
      file: catalog/docker-compose.yml
      service: api
    depends_on: !reset {}
    environment:
      CATALOG_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@catalog-db:5432/catalog

  catalog-migrate:
    extends:
      file: catalog/docker-compose.yml
      service: migrate
    depends_on: !reset {}
    environment:
      CATALOG_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@catalog-db:5432/catalog

  catalog-db:
    extends:
      file: catalog/docker-compose.yml
      service: db

  # -----------------------------------------------------------
  # INVENTORY MICROSERVICE
  # -----------------------------------------------------------
  inventory:
    extends:
      file: inventory/docker-compose.yml
      service: api
    depends_on: !reset {}
    environment:
      INVENTORY_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@inventory-db:5432/inventory
      INVENTORY_RABBITMQ_URL: amqp://flashmarket:flashmarket@rabbitmq:5672/

  inventory-migrate:
    extends:
      file: inventory/docker-compose.yml
      service: migrate
    depends_on: !reset {}
    environment:
      INVENTORY_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@inventory-db:5432/inventory

  inventory-db:
    extends:
      file: inventory/docker-compose.yml
      service: db

  inventory-consumer:
    extends:
      file: inventory/docker-compose.yml
      service: consumer
    depends_on: !reset {}
    environment:
      INVENTORY_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@inventory-db:5432/inventory
      INVENTORY_RABBITMQ_URL: amqp://flashmarket:flashmarket@rabbitmq:5672/

  inventory-outbox:
    extends:
      file: inventory/docker-compose.yml
      service: outbox
    depends_on: !reset {}
