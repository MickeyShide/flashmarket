name: flashmarket

services:
  auth:
    extends:
      file: auth/docker-compose.yml
      service: api
    depends_on: !reset {}
    environment:
      AUTH_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@auth-db:5432/auth
      AUTH_REDIS_URL: redis://auth-redis:6379/0
      AUTH_RABBITMQ_URL: amqp://flashmarket:flashmarket@auth-rabbitmq:5672/
    volumes:
      - auth-jwt-keys:/var/lib/flashmarket-auth/keys:ro

  auth-migrate:
    extends:
      file: auth/docker-compose.yml
      service: migrate
    depends_on: !reset {}
    environment:
      AUTH_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@auth-db:5432/auth

  auth-db:
    extends:
      file: auth/docker-compose.yml
      service: db

  auth-redis:
    extends:
      file: auth/docker-compose.yml
      service: redis

  auth-outbox:
    extends:
      file: auth/docker-compose.yml
      service: outbox
    depends_on: !reset {}
    environment:
      AUTH_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@auth-db:5432/auth
      AUTH_REDIS_URL: redis://auth-redis:6379/0
      AUTH_RABBITMQ_URL: amqp://flashmarket:flashmarket@auth-rabbitmq:5672/

  auth-rabbitmq:
    extends:
      file: auth/docker-compose.yml
      service: rabbitmq

  catalog:
    extends:
      file: catalog/docker-compose.yml
