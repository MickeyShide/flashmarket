name: flashmarket-media

x-media-runtime: &media-runtime
  image: flashmarket-media-api:local
  pull_policy: never

x-media-environment: &media-environment
  MEDIA_ENVIRONMENT: development
  MEDIA_DATABASE_URL: postgresql+asyncpg://${INFRA_USER:-shide}:${POSTGRES_PASSWORD:-shide}@shide-postgres:5432/media
  MEDIA_S3_INTERNAL_ENDPOINT: ${MEDIA_S3_INTERNAL_ENDPOINT:-http://shide-minio:9000}
  MEDIA_S3_PUBLIC_ENDPOINT: ${MEDIA_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  MEDIA_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-shide}
  MEDIA_S3_SECRET_KEY: ${S3_SECRET_KEY:-shide}
  MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-flashmarket-public}
  MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:9000/flashmarket-public}
  MEDIA_CORS_ORIGINS: '["http://localhost:3000"]'
  MEDIA_TRUSTED_HOSTS: '["localhost","127.0.0.1","media","gateway"]'
  MEDIA_ALLOW_INSECURE_INTERNAL_SERVICES: 'true'
  MEDIA_JWT_PUBLIC_KEY_DIR: /var/lib/flashmarket/keys/public
  MEDIA_JWT_ALGORITHM: EdDSA
  MEDIA_JWT_ISSUER: flashmarket-auth
  MEDIA_JWT_AUDIENCE: flashmarket-api

services:
  api:
    <<: *media-runtime
    build:
      context: ..
      dockerfile: media/Dockerfile
    environment:
      <<: *media-environment
      MEDIA_LOG_FILE_PATH: /var/log/shide/media-api.log
    ports:
      - "127.0.0.1:${MEDIA_PORT:-4926}:8000"
    volumes:
      - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro
      - backend-logs-local:/var/log/shide
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  cleanup:
    <<: *media-runtime
    build:
      context: ..
      dockerfile: media/Dockerfile
    environment:
      <<: *media-environment
      MEDIA_LOG_FILE_PATH: /var/log/shide/media-cleanup.log
    volumes:
      - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro
      - backend-logs-local:/var/log/shide
    command: ["cleanup", "python", "-m", "media_service.cleanup_worker"]
    restart: unless-stopped

volumes:
  auth-jwt-keys-public:
  backend-logs-local:
    external: true
    name: shide-backend-logs-local

networks:
  default:
    name: shide-observability
    external: true
