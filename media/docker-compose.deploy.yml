name: flashmarket-media

x-media-runtime: &media-runtime
  image: ${MEDIA_IMAGE:?MEDIA_IMAGE must contain the image digest}
  pull_policy: always
  env_file:
    - ${MEDIA_ENV_FILE:-.env}
  networks:
    backend:
      aliases:
        - media

services:
  api:
    <<: *media-runtime
    mem_limit: ${MEDIA_API_MEMORY_LIMIT:-384m}
    mem_reservation: ${MEDIA_API_MEMORY_RESERVATION:-128m}
    pids_limit: ${MEDIA_API_PIDS_LIMIT:-128}
    init: true
    stop_grace_period: 30s
    logging: &bounded-logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    environment:
      MEDIA_JWT_PUBLIC_KEY_DIR: /var/lib/flashmarket/keys/public
      MEDIA_JWT_ALGORITHM: EdDSA
      MEDIA_JWT_ISSUER: flashmarket-auth
      MEDIA_JWT_AUDIENCE: flashmarket-api
    volumes:
      - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  cleanup:
    <<: *media-runtime
    mem_limit: ${MEDIA_MAINTENANCE_MEMORY_LIMIT:-128m}
    mem_reservation: ${MEDIA_MAINTENANCE_MEMORY_RESERVATION:-40m}
    pids_limit: ${MEDIA_MAINTENANCE_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 20s
    logging: *bounded-logging
    command: ["cleanup", "python", "-m", "media_service.cleanup_worker"]
    volumes:
      - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro
    restart: unless-stopped

networks:
  backend:
    external: true
    name: shide-observability

volumes:
  auth-jwt-keys-public:
    external: true
    name: flashmarket-auth-jwt-keys-public
