name: flashmarket-auth

x-auth-runtime: &auth-runtime
  image: ${AUTH_IMAGE:?AUTH_IMAGE must contain the image digest}
  pull_policy: always
  env_file:
    - ${AUTH_ENV_FILE:-.env}
  networks:
    backend:
      aliases:
        - auth

services:
  keygen:
    <<: *auth-runtime
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -d /var/lib/flashmarket-auth/legacy-keys/public ]; then
          cp -n /var/lib/flashmarket-auth/legacy-keys/public/*.pem \
            /var/lib/flashmarket-auth/keys/public/ 2>/dev/null || true
        fi
        exec .venv/bin/python scripts/generate_jwt_keys.py \
          --output-dir /var/lib/flashmarket-auth/keys \
          --key-id "$${AUTH_JWT_KEY_ID}"
    volumes:
      - auth-jwt-keys:/var/lib/flashmarket-auth/keys
      - auth-jwt-keys:/var/lib/flashmarket-auth/legacy-keys:ro
      - auth-jwt-keys-public:/var/lib/flashmarket-auth/keys/public
    restart: "no"

  api:
    <<: *auth-runtime
    volumes:
      - auth-jwt-keys:/var/lib/flashmarket-auth/keys
      - auth-jwt-keys-public:/var/lib/flashmarket-auth/keys/public:ro
    depends_on:
      keygen:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    env_file:
      - ${AUTH_ENV_FILE:-.env}
    ports:
      - "${AUTH_PROXY_PORT:-4918}:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - frontend
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  cleanup:
    <<: *auth-runtime
    command:
      - cleanup
      - sh
      - -c
      - while true; do .venv/bin/python -m auth_service.cli cleanup-expired; sleep 3600; done
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  outbox:
    <<: *auth-runtime
    command:
      - outbox
      - auth_service.outbox_worker
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  frontend:
    external: true
    name: shide-observability
  backend:
    external: true
    name: shide-observability

volumes:
  auth-jwt-keys:
  auth-jwt-keys-public:
    name: flashmarket-auth-jwt-keys-public
