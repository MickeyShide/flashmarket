name: flashmarket-auth

x-auth-runtime: &auth-runtime
  image: ${AUTH_IMAGE:?AUTH_IMAGE must contain the image digest}
  pull_policy: always
  env_file:
    - ${AUTH_ENV_FILE:-.env}
  networks:
    backend:
      aliases:
        - auth

services:
  keygen:
    <<: *auth-runtime
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -d /var/lib/flashmarket-auth/legacy-keys/public ]; then
          cp -n /var/lib/flashmarket-auth/legacy-keys/public/*.pem \
            /var/lib/flashmarket-auth/keys/public/ 2>/dev/null || true
        fi
        exec .venv/bin/python scripts/generate_jwt_keys.py \
          --output-dir /var/lib/flashmarket-auth/keys \
          --key-id "$${AUTH_JWT_KEY_ID}"
    volumes:
      - auth-jwt-keys:/var/lib/flashmarket-auth/keys
      - auth-jwt-keys:/var/lib/flashmarket-auth/legacy-keys:ro
      - auth-jwt-keys-public:/var/lib/flashmarket-auth/keys/public
    restart: "no"

  api:
    <<: *auth-runtime
    mem_limit: ${AUTH_API_MEMORY_LIMIT:-256m}
    mem_reservation: ${AUTH_API_MEMORY_RESERVATION:-96m}
    pids_limit: ${AUTH_API_PIDS_LIMIT:-128}
    init: true
    stop_grace_period: 20s
    logging: &bounded-logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    volumes:
      - auth-jwt-keys:/var/lib/flashmarket-auth/keys
      - auth-jwt-keys-public:/var/lib/flashmarket-auth/keys/public:ro
    depends_on:
      keygen:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    env_file:
      - ${AUTH_ENV_FILE:-.env}
    ports:
      - "${AUTH_PROXY_PORT:-4918}:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - frontend
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    mem_limit: ${AUTH_NGINX_MEMORY_LIMIT:-32m}
    mem_reservation: ${AUTH_NGINX_MEMORY_RESERVATION:-8m}
    pids_limit: ${AUTH_NGINX_PIDS_LIMIT:-32}
    init: true
    stop_grace_period: 10s
    logging: *bounded-logging

  cleanup:
    <<: *auth-runtime
    mem_limit: ${AUTH_MAINTENANCE_MEMORY_LIMIT:-128m}
    mem_reservation: ${AUTH_MAINTENANCE_MEMORY_RESERVATION:-40m}
    pids_limit: ${AUTH_MAINTENANCE_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 20s
    logging: *bounded-logging
    command:
      - cleanup
      - sh
      - -c
      - while true; do .venv/bin/python -m auth_service.cli cleanup-expired && .venv/bin/python -c "from rabbitmq_reliability import touch_heartbeat; touch_heartbeat('/tmp/flashmarket-heartbeat.json', 'tick_complete')"; sleep 3600; done
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "rabbitmq_reliability.heartbeat", "/tmp/flashmarket-heartbeat.json", "3700"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 120s

  outbox:
    <<: *auth-runtime
    mem_limit: ${AUTH_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${AUTH_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${AUTH_WORKER_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 20s
    logging: *bounded-logging
    command:
      - outbox
      - auth_service.outbox_worker
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "rabbitmq_reliability.heartbeat", "/tmp/flashmarket-heartbeat.json", "45"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 45s

networks:
  frontend:
    external: true
    name: shide-observability
  backend:
    external: true
    name: shide-observability

volumes:
  auth-jwt-keys:
  auth-jwt-keys-public:
    name: flashmarket-auth-jwt-keys-public
