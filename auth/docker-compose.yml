name: flashmarket-auth

x-auth-runtime: &auth-runtime
  image: flashmarket-auth-api:local
  pull_policy: never

x-auth-environment: &auth-environment
  AUTH_ENVIRONMENT: development
  AUTH_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@db:5432/auth
  AUTH_REDIS_URL: redis://redis:6379/0
  AUTH_RABBITMQ_URL: amqp://flashmarket:flashmarket@rabbitmq:5672/
  AUTH_JWT_KEYS_DIRECTORY: /var/lib/flashmarket-auth/keys
  AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID:-flashmarket-auth-ed25519-v1}
  AUTH_CORS_ORIGINS: '["http://localhost:3000"]'

services:
  keygen:
    <<: *auth-runtime
    command:
      - .venv/bin/python
      - scripts/generate_jwt_keys.py
      - --output-dir
      - /var/lib/flashmarket-auth/keys
      - --key-id
      - ${AUTH_JWT_KEY_ID:-flashmarket-auth-ed25519-v1}
    volumes:
      - auth-jwt-keys:/var/lib/flashmarket-auth/keys
    restart: "no"

  migrate:
    <<: *auth-runtime
    environment:
      AUTH_ENVIRONMENT: development
      AUTH_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@db:5432/auth
    command: [".venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *auth-runtime
    build:
      context: .
    environment: *auth-environment
    ports:
      - "127.0.0.1:${AUTH_PORT:-8000}:8000"
    depends_on:
      keygen:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - auth-jwt-keys:/var/lib/flashmarket-auth/keys:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  cleanup:
    <<: *auth-runtime
    environment:
      AUTH_ENVIRONMENT: development
      AUTH_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@db:5432/auth
    command:
      - sh
      - -c
      - while true; do .venv/bin/python -m auth_service.cli cleanup-expired; sleep 3600; done
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  outbox:
    <<: *auth-runtime
    environment: *auth-environment
    command: [".venv/bin/python", "-m", "auth_service.outbox_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: flashmarket
      POSTGRES_PASSWORD: flashmarket
    ports:
      - "127.0.0.1:${AUTH_DB_PORT:-5432}:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashmarket -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${AUTH_REDIS_PORT:-6379}:6379"
    volumes:
      - auth-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: flashmarket
      RABBITMQ_DEFAULT_PASS: flashmarket
    ports:
      - "127.0.0.1:${AUTH_RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${AUTH_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - auth-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  auth-jwt-keys:
  auth-postgres-data:
  auth-rabbitmq-data:
  auth-redis-data:
