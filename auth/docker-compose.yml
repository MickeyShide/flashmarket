name: flashmarket-auth

x-auth-runtime: &auth-runtime
  image: flashmarket-auth-api:local
  pull_policy: never
  init: true
  stop_grace_period: 20s
  logging: &bounded-logging
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

x-auth-environment: &auth-environment
  AUTH_ENVIRONMENT: development
  AUTH_DATABASE_URL: postgresql+asyncpg://${INFRA_USER:-shide}:${POSTGRES_PASSWORD:-shide}@shide-postgres:5432/auth
  AUTH_REDIS_URL: redis://shide-redis:6379/0
  AUTH_RABBITMQ_URL: amqp://${INFRA_USER:-shide}:${RABBITMQ_PASSWORD:-shide}@shide-rabbitmq:5672/flashmarket
  AUTH_JWT_KEYS_DIRECTORY: /var/lib/flashmarket-auth/keys
  AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID:-flashmarket-auth-ed25519-v1}
  AUTH_CORS_ORIGINS: '["http://localhost:3000","http://localhost:8080"]'
  AUTH_TRUSTED_HOSTS: '["localhost","127.0.0.1","auth","gateway"]'
  AUTH_REFRESH_COOKIE_SECURE: 'false'
  AUTH_REFRESH_COOKIE_SAMESITE: 'lax'
  AUTH_LOG_FILE_PATH: /var/log/shide/auth-api.log
  AUTH_ALLOW_INSECURE_INTERNAL_SERVICES: 'true'

services:
  keygen:
    <<: *auth-runtime
    command:
      - .venv/bin/python
      - scripts/generate_jwt_keys.py
      - --output-dir
      - /var/lib/flashmarket-auth/keys
      - --key-id
      - ${AUTH_JWT_KEY_ID:-flashmarket-auth-ed25519-v1}
    volumes:
      - auth-jwt-keys-private:/var/lib/flashmarket-auth/keys/private
      - auth-jwt-keys-public:/var/lib/flashmarket-auth/keys/public
    restart: "no"
    mem_limit: ${AUTH_MAINTENANCE_MEMORY_LIMIT:-128m}
    mem_reservation: ${AUTH_MAINTENANCE_MEMORY_RESERVATION:-40m}
    pids_limit: ${AUTH_MAINTENANCE_PIDS_LIMIT:-64}

  api:
    <<: *auth-runtime
    build:
      context: ..
      dockerfile: auth/Dockerfile
    environment: *auth-environment
    ports:
      - "127.0.0.1:${AUTH_PORT:-4918}:8000"
    depends_on:
      keygen:
        condition: service_completed_successfully
    volumes:
      - auth-jwt-keys-private:/var/lib/flashmarket-auth/keys/private:ro
      - auth-jwt-keys-public:/var/lib/flashmarket-auth/keys/public:ro
      - backend-logs-local:/var/log/shide
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    mem_limit: ${AUTH_API_MEMORY_LIMIT:-256m}
    mem_reservation: ${AUTH_API_MEMORY_RESERVATION:-96m}
    pids_limit: ${AUTH_API_PIDS_LIMIT:-128}

  cleanup:
    <<: *auth-runtime
    command:
      - cleanup
      - python
      - -m
      - auth_service.cleanup_worker
    environment:
      <<: *auth-environment
      AUTH_LOG_FILE_PATH: /var/log/shide/auth-cleanup.log
    volumes:
      - backend-logs-local:/var/log/shide
    restart: unless-stopped
    mem_limit: ${AUTH_MAINTENANCE_MEMORY_LIMIT:-128m}
    mem_reservation: ${AUTH_MAINTENANCE_MEMORY_RESERVATION:-40m}
    pids_limit: ${AUTH_MAINTENANCE_PIDS_LIMIT:-64}
    healthcheck:
      test: ["CMD", "python", "-m", "rabbitmq_reliability.heartbeat", "/tmp/flashmarket-heartbeat.json", "3700"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 120s

  outbox:
    <<: *auth-runtime
    environment: *auth-environment
    command:
      - outbox
      - auth_service.outbox_worker
    volumes:
      - backend-logs-local:/var/log/shide
    restart: unless-stopped
    mem_limit: ${AUTH_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${AUTH_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${AUTH_WORKER_PIDS_LIMIT:-64}
    healthcheck:
      test: ["CMD-SHELL", "python -m rabbitmq_reliability.heartbeat /tmp/flashmarket-heartbeat.json $${AUTH_WORKER_HEARTBEAT_STALE_SECONDS:-45}"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 45s

volumes:
  auth-jwt-keys-private:
  auth-jwt-keys-public:
  backend-logs-local:
    external: true
    name: shide-backend-logs-local

networks:
  default:
    name: shide-observability
    external: true
