[project]
name = "flashmarket-auth"
version = "0.1.0"
description = "Identity and session management service for FlashMarket"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10,<11",
    "flashmarket-celery-runtime",
    "rabbitmq_reliability",
    "alembic>=1.18,<2",
    "argon2-cffi>=25.1,<26",
    "asyncpg>=0.31,<1",
    "cryptography>=50,<51",
    "email-validator>=2.3,<3",
    "fastapi>=0.140,<1",
    "prometheus-client>=0.26,<1",
    "pyjwt>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "redis>=8,<9",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.51,<1",
]

[tool.uv.sources]
flashmarket-celery-runtime = { path = "../shared/celery_runtime" }
rabbitmq_reliability = { path = "../shared/rabbitmq_reliability" }

[dependency-groups]
dev = [
    "aiosqlite>=0.22,<1",
    "fakeredis>=2.37,<3",
    "httpx>=0.28,<1",
    "mypy>=2.1,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_service"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a real PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
files = ["src/auth_service"]
plugins = ["pydantic.mypy"]
strict = true
pretty = true
show_error_codes = true
show_error_context = true
warn_unreachable = true
