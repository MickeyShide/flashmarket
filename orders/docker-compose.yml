name: flashmarket-orders

x-orders-runtime: &orders-runtime
  image: flashmarket-orders-api:local
  pull_policy: never

x-orders-environment: &orders-environment
  ORDERS_ENVIRONMENT: development
  ORDERS_DATABASE_URL: postgresql+asyncpg://${INFRA_USER:-shide}:${POSTGRES_PASSWORD:-shide}@shide-postgres:5432/orders
  ORDERS_RABBITMQ_URL: amqp://${INFRA_USER:-shide}:${RABBITMQ_PASSWORD:-shide}@shide-rabbitmq:5672/flashmarket
  ORDERS_CORS_ORIGINS: '["http://localhost:3000"]'
  ORDERS_TRUSTED_HOSTS: '["localhost","127.0.0.1","orders","gateway"]'
  ORDERS_LOG_FILE_PATH: /var/log/shide/orders-api.log
  ORDERS_ALLOW_INSECURE_INTERNAL_SERVICES: 'true'
  ORDERS_JWT_PUBLIC_KEY_DIR: /var/lib/flashmarket/keys/public
  ORDERS_JWT_ALGORITHM: EdDSA
  ORDERS_JWT_ISSUER: flashmarket-auth
  ORDERS_JWT_AUDIENCE: flashmarket-api

services:
  api:
    <<: *orders-runtime
    build:
      context: ..
      dockerfile: orders/Dockerfile
    environment: *orders-environment
    ports:
      - "127.0.0.1:${ORDERS_PORT:-4920}:8000"
    volumes:
      - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro
      - backend-logs-local:/var/log/shide
      - orders-metrics-data:/tmp/prometheus
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  consumer:
    <<: *orders-runtime
    environment:
      <<: *orders-environment
      ORDERS_LOG_FILE_PATH: /var/log/shide/orders-consumer.log
    command:
      - consumer
      - orders.event_consumer
    volumes:
      - backend-logs-local:/var/log/shide
    restart: unless-stopped

  outbox:
    <<: *orders-runtime
    environment:
      <<: *orders-environment
      ORDERS_LOG_FILE_PATH: /var/log/shide/orders-outbox.log
    command:
      - outbox
      - orders.outbox_worker
    volumes:
      - backend-logs-local:/var/log/shide
    restart: unless-stopped

volumes:
  orders-metrics-data:
  backend-logs-local:
    external: true
    name: shide-backend-logs-local

networks:
  default:
    name: shide-observability
    external: true
