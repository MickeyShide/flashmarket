name: flashmarket-orders

x-orders-runtime: &orders-runtime
  image: ${ORDERS_IMAGE:-flashmarket-orders-api:local}
  pull_policy: always
  env_file:
    - ${ORDERS_ENV_FILE:-.env}
  networks:
    backend:
      aliases:
        - orders

x-orders-environment: &orders-environment
  ORDERS_ENVIRONMENT: ${ORDERS_ENVIRONMENT:-production}
  ORDERS_DATABASE_URL: ${ORDERS_DATABASE_URL}
  ORDERS_RABBITMQ_URL: ${ORDERS_RABBITMQ_URL}
  ORDERS_PAYMENT_TIMEOUT_SECONDS: ${ORDERS_PAYMENT_TIMEOUT_SECONDS:-300}
  ORDERS_CORS_ORIGINS: ${ORDERS_CORS_ORIGINS:-[]}
  ORDERS_TRUSTED_HOSTS: ${ORDERS_TRUSTED_HOSTS}
  ORDERS_DOCS_ENABLED: ${ORDERS_DOCS_ENABLED:-false}
  ORDERS_DEBUG: ${ORDERS_DEBUG:-false}
  ORDERS_ALLOW_INSECURE_INTERNAL_SERVICES: ${ORDERS_ALLOW_INSECURE_INTERNAL_SERVICES:-false}
  ORDERS_JWT_PUBLIC_KEY_DIR: /var/lib/flashmarket/keys/public
  ORDERS_JWT_ALGORITHM: EdDSA
  ORDERS_JWT_ISSUER: flashmarket-auth
  ORDERS_JWT_AUDIENCE: flashmarket-api

services:
  api:
    <<: *orders-runtime
    mem_limit: ${ORDERS_API_MEMORY_LIMIT:-256m}
    mem_reservation: ${ORDERS_API_MEMORY_RESERVATION:-96m}
    pids_limit: ${ORDERS_API_PIDS_LIMIT:-128}
    init: true
    stop_grace_period: 20s
    logging: &bounded-logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    environment: *orders-environment
    volumes:
      - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro
    depends_on: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  consumer:
    <<: *orders-runtime
    mem_limit: ${ORDERS_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${ORDERS_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${ORDERS_WORKER_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 20s
    logging: *bounded-logging
    environment: *orders-environment
    command:
      - consumer
      - orders.event_consumer
    depends_on: {}
    restart: unless-stopped

  outbox:
    <<: *orders-runtime
    mem_limit: ${ORDERS_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${ORDERS_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${ORDERS_WORKER_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 20s
    logging: *bounded-logging
    environment: *orders-environment
    command:
      - outbox
      - orders.outbox_worker
    depends_on: {}
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    env_file:
      - ${ORDERS_ENV_FILE:-.env}
    ports:
      - "${ORDERS_PROXY_PORT:-4920}:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - frontend
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    mem_limit: ${ORDERS_NGINX_MEMORY_LIMIT:-32m}
    mem_reservation: ${ORDERS_NGINX_MEMORY_RESERVATION:-8m}
    pids_limit: ${ORDERS_NGINX_PIDS_LIMIT:-32}
    init: true
    stop_grace_period: 10s
    logging: *bounded-logging

networks:
  frontend:
    external: true
    name: shide-observability
  backend:
    external: true
    name: shide-observability

volumes:
  auth-jwt-keys-public:
    external: true
    name: flashmarket-auth-jwt-keys-public
