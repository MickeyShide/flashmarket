name: flashmarket-catalog

x-catalog-runtime: &catalog-runtime
  image: flashmarket-catalog-api:local
  pull_policy: never

x-catalog-environment: &catalog-environment
  CATALOG_ENVIRONMENT: development
  CATALOG_DATABASE_URL: postgresql+asyncpg://${INFRA_USER:-shide}:${POSTGRES_PASSWORD:-shide}@shide-postgres:5432/catalog
  CATALOG_REDIS_URL: redis://shide-redis:6379/1
  CATALOG_CATEGORY_CACHE_TTL_SECONDS: '60'
  CATALOG_REDIS_SOCKET_TIMEOUT_SECONDS: '0.2'
  CATALOG_CORS_ORIGINS: '["http://localhost:3000"]'
  CATALOG_LOG_FILE_PATH: /var/log/shide/catalog-api.log
  CATALOG_PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
  CATALOG_ALLOW_INSECURE_INTERNAL_SERVICES: 'true'
  CATALOG_JWT_PUBLIC_KEY_DIR: /var/lib/flashmarket/keys/public
  CATALOG_JWT_ALGORITHM: EdDSA
  CATALOG_JWT_ISSUER: flashmarket-auth
  CATALOG_JWT_AUDIENCE: flashmarket-api

services:
  api:
    <<: *catalog-runtime
    build:
      context: ..
      dockerfile: catalog/Dockerfile
    environment: *catalog-environment
    ports:
      - "127.0.0.1:${CATALOG_PORT:-4919}:8000"
    volumes:
      - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro
      - backend-logs-local:/var/log/shide
      - catalog-metrics-data:/tmp/prometheus
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  catalog-metrics-data:
  backend-logs-local:
    external: true
    name: shide-backend-logs-local

networks:
  default:
    name: shide-observability
    external: true
