name: flashmarket-catalog

x-catalog-runtime: &catalog-runtime
  image: ${CATALOG_IMAGE:?CATALOG_IMAGE must contain the image digest}
  pull_policy: always
  env_file:
    - ${CATALOG_ENV_FILE:-.env}
  networks:
    - backend

services:
  api:
    <<: *catalog-runtime
    depends_on: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    env_file:
      - ${CATALOG_ENV_FILE:-.env}
    ports:
      - "${CATALOG_PROXY_PORT:-4919}:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - frontend
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          --header="Host: $${CATALOG_DOMAIN}"
          http://127.0.0.1/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

networks:
  frontend:
    external: true
    name: shide-observability
  backend:
    external: true
    name: shide-observability
