name: flashmarket-catalog

x-catalog-runtime: &catalog-runtime
  image: ${CATALOG_IMAGE:?CATALOG_IMAGE must contain the image digest}
  pull_policy: always
  env_file:
    - ${CATALOG_ENV_FILE:-.env}
  networks:
    backend:
      aliases:
        - catalog

services:
  api:
    <<: *catalog-runtime
    mem_limit: ${CATALOG_API_MEMORY_LIMIT:-192m}
    mem_reservation: ${CATALOG_API_MEMORY_RESERVATION:-72m}
    pids_limit: ${CATALOG_API_PIDS_LIMIT:-96}
    init: true
    stop_grace_period: 20s
    logging: &bounded-logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    environment:
      CATALOG_JWT_PUBLIC_KEY_DIR: /var/lib/flashmarket/keys/public
      CATALOG_JWT_ALGORITHM: EdDSA
      CATALOG_JWT_ISSUER: flashmarket-auth
      CATALOG_JWT_AUDIENCE: flashmarket-api
    volumes:
      - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro
    depends_on: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    env_file:
      - ${CATALOG_ENV_FILE:-.env}
    ports:
      - "${CATALOG_PROXY_PORT:-4919}:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - frontend
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    mem_limit: ${CATALOG_NGINX_MEMORY_LIMIT:-32m}
    mem_reservation: ${CATALOG_NGINX_MEMORY_RESERVATION:-8m}
    pids_limit: ${CATALOG_NGINX_PIDS_LIMIT:-32}
    init: true
    stop_grace_period: 10s
    logging: *bounded-logging

networks:
  frontend:
    external: true
    name: shide-observability
  backend:
    external: true
    name: shide-observability

volumes:
  auth-jwt-keys-public:
    external: true
    name: flashmarket-auth-jwt-keys-public
