# -----------------------------------------------------------
# MAIN GATEWAY SERVER (Path routing + Frontend)
# -----------------------------------------------------------
# All upstreams use variables so Nginx resolves them at
# request-time via the Docker DNS resolver.  This prevents
# crash-loops when a service container is not yet running.
#
# IMPORTANT: When proxy_pass uses a variable, Nginx does NOT
# auto-append the original URI.  We must add $request_uri
# explicitly to preserve the request path and query string.
# -----------------------------------------------------------

# Trusted proxy handling is shared by every virtual server so the same client
# address is used for forwarding and rate limiting on both the main domain and
# service subdomains.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Requests with an empty limit key are not accounted by Nginx. Keep probes and
# monitoring traffic independent from public API quotas.
map $uri $rate_limit_client_key {
    default                       $binary_remote_addr;
    ~^/health(?:/|$)              "";
    /metrics                      "";
    ~^/prometheus(?:/|$)          "";
    /nginx_status                 "";
}

# WebSocket upgrade header mapping for HMR and WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# The local object-storage listener is intentionally cross-origin because the
# application uses port 8080/3000 and presigned storage uses port 9000. Reflect
# only supported development origins; an empty value causes Nginx to omit the
# Access-Control-Allow-Origin response header.
map $http_origin $media_cors_origin {
    default                   "";
    http://localhost:3000     $http_origin;
    http://127.0.0.1:3000     $http_origin;
    http://localhost:8080     $http_origin;
    http://127.0.0.1:8080     $http_origin;
}

limit_req_zone $rate_limit_client_key zone=auth_limit:10m rate=5r/s;
limit_req_zone $rate_limit_client_key zone=transaction_limit:10m rate=10r/s;
limit_req_zone $rate_limit_client_key zone=catalog_limit:10m rate=50r/s;
limit_req_zone $rate_limit_client_key zone=general_limit:10m rate=20r/s;

limit_req_status 429;
limit_req_log_level warn;
error_page 429 = @rate_limited;

# Same-origin, read-only readiness targets for the public Developer Hub. The
# browser only interprets the HTTP result; internal container addresses never
# appear in the generated frontend metadata.
map $uri $dev_status_upstream {
    default                    "";
    /dev/status/auth           http://auth:8000/health/ready;
    /dev/status/catalog        http://catalog:8000/health/ready;
    /dev/status/inventory      http://inventory:8000/health/ready;
    /dev/status/orders         http://orders:8000/health/ready;
    /dev/status/payments       http://payments:8000/health/ready;
    /dev/status/notifications  http://notifications:8000/health/ready;
    /dev/status/wishlist       http://wishlist:8000/health/ready;
    /dev/status/drops          http://drops:8000/health/ready;
    /dev/status/media          http://media:8000/health/ready;
}

server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 ${GATEWAY_DOMAIN} _;
    server_tokens off;

    client_max_body_size 16k;

    # Docker internal DNS — enables dynamic upstream resolution
    # so nginx finds new containers without restart
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_redirect off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;


    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location ^~ /dev/status/ {
        access_log off;
        limit_except GET {
            deny all;
        }
        if ($dev_status_upstream = "") {
            return 404;
        }
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_pass $dev_status_upstream;
    }

    # ---- Auth ----
    location /api/v1/auth {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    location /api/v1/users {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    location /api/v1/sessions {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    location ^~ /api/v1/admin/drops {
        limit_req zone=catalog_limit burst=100 nodelay;
        set $upstream_drops http://drops:8000;
        proxy_pass $upstream_drops$request_uri;
    }

    location /api/v1/admin {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    location /auth {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    location /sessions {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    location /users {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    location /admin {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    location /.well-known {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    # ---- Catalog ----
    location /api/v1/products {
        limit_req zone=catalog_limit burst=100 nodelay;
        set $upstream_catalog http://catalog:8000;
        proxy_pass $upstream_catalog$request_uri;
    }

    location /api/v1/categories {
        limit_req zone=catalog_limit burst=100 nodelay;
        set $upstream_catalog http://catalog:8000;
        proxy_pass $upstream_catalog$request_uri;
    }

    location /api/v1/brands {
        limit_req zone=catalog_limit burst=100 nodelay;
        set $upstream_catalog http://catalog:8000;
        proxy_pass $upstream_catalog$request_uri;
    }

    # ---- Inventory ----
    location /api/v1/stocks {
        limit_req zone=general_limit burst=40 nodelay;
        set $upstream_inventory http://inventory:8000;
        proxy_pass $upstream_inventory$request_uri;
    }

    # ---- Orders ----
    location /api/v1/orders {
        limit_req zone=transaction_limit burst=20 nodelay;
        set $upstream_orders http://orders:8000;
        proxy_pass $upstream_orders$request_uri;
    }

    location /api/v1/promocodes {
        limit_req zone=transaction_limit burst=20 nodelay;
        set $upstream_orders http://orders:8000;
        proxy_pass $upstream_orders$request_uri;
    }

    # ---- Payments ----
    location /api/v1/payments {
        limit_req zone=transaction_limit burst=20 nodelay;
        set $upstream_payments http://payments:8000;
        proxy_pass $upstream_payments$request_uri;
    }

    # ---- Notifications ----
    location /api/v1/notifications {
        limit_req zone=general_limit burst=40 nodelay;
        set $upstream_notifications http://notifications:8000;
        proxy_pass $upstream_notifications$request_uri;
    }

    # ---- Wishlist ----
    location /api/v1/wishlist {
        limit_req zone=transaction_limit burst=20 nodelay;
        set $upstream_wishlist http://wishlist:8000;
        proxy_pass $upstream_wishlist$request_uri;
    }

    # ---- Drops ----
    location /api/v1/drops {
        limit_req zone=catalog_limit burst=100 nodelay;
        set $upstream_drops http://drops:8000;
        proxy_pass $upstream_drops$request_uri;
    }

    # ---- Browser-visible object storage ----
    # Keep uploaded bytes out of FastAPI while reusing the existing public TLS
    # origin. The prefix is removed before forwarding the S3 path to MinIO.
    location = /media-storage {
        return 308 /media-storage/;
    }

    location ^~ /media-storage/ {
        client_max_body_size 30m;
        set $upstream_storage http://shide-minio:9000;
        rewrite ^/media-storage(/.*)$ $1 break;
        proxy_pass $upstream_storage$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ---- Media ----
    location /api/v1/media {
        limit_req zone=transaction_limit burst=20 nodelay;
        set $upstream_media http://media:8000;
        proxy_pass $upstream_media$request_uri;
    }

    # ---- Frontend (catch-all) ----
    location / {
        set $upstream_frontend http://frontend:3000;
        proxy_pass $upstream_frontend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ---- Prometheus ----
    location /prometheus {
        return 301 /prometheus/;
    }

    location /prometheus/ {
        set $upstream_prometheus http://shide-prometheus:9090;
        rewrite ^/prometheus/(.*) /$1 break;
        proxy_pass $upstream_prometheus;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After "1" always;
        return 429 '{"error":{"code":"rate_limit_exceeded","message":"Too many requests"}}';
    }
}

# -----------------------------------------------------------
# LOCAL OBJECT-STORAGE ENDPOINT
# -----------------------------------------------------------
# Media signs browser-visible uploads for localhost:9000 while all internal
# validation continues to use shide-minio:9000. Keep this listener isolated
# from the JSON API body limit and stream uploads without request buffering.
server {
    listen 9000;
    server_name localhost 127.0.0.1 _;
    server_tokens off;

    client_max_body_size 30m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_storage http://shide-minio:9000;
        proxy_pass $upstream_storage$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $media_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
        add_header Access-Control-Expose-Headers "ETag, x-amz-request-id" always;
        add_header Access-Control-Max-Age 3600 always;
        add_header Vary Origin always;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}

