upstream auth {
    server auth:8000;
}

upstream catalog {
    server catalog:8000;
}

upstream inventory {
    server inventory:8000;
}

upstream orders {
    server orders:8000;
}

upstream payments {
    server payments:8000;
}

upstream notifications {
    server notifications:8000;
}

upstream frontend {
    server frontend:3000;
}

# -----------------------------------------------------------
# MAIN GATEWAY SERVER (Path routing + Frontend)
# -----------------------------------------------------------
server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 ${GATEWAY_DOMAIN} _;
    server_tokens off;

    client_max_body_size 16k;

    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker internal DNS — enables dynamic upstream resolution
    # so nginx finds new containers without restart
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_redirect off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;


    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location /api/v1/auth {
        proxy_pass http://auth;
    }

    location /api/v1/users {
        proxy_pass http://auth;
    }

    location /api/v1/sessions {
        proxy_pass http://auth;
    }

    location /api/v1/admin {
        proxy_pass http://auth;
    }

    location /auth {
        proxy_pass http://auth;
    }

    location /sessions {
        proxy_pass http://auth;
    }

    location /users {
        proxy_pass http://auth;
    }

    location /admin {
        proxy_pass http://auth;
    }

    location /.well-known {
        proxy_pass http://auth;
    }

    location /api/v1/products {
        proxy_pass http://catalog;
    }

    location /api/v1/categories {
        proxy_pass http://catalog;
    }

    location /api/v1/brands {
        proxy_pass http://catalog;
    }

    location /api/v1/internal {
        proxy_pass http://catalog;
    }

    location /api/v1/stocks {
        proxy_pass http://inventory;
    }

    location /internal {
        proxy_pass http://inventory;
    }

    location /api/v1/orders {
        proxy_pass http://orders;
    }

    location /api/v1/payments {
        proxy_pass http://payments;
    }

    location /api/v1/notifications {
        proxy_pass http://notifications;
    }

    location / {
        proxy_pass http://frontend;
    }

    location /prometheus {
        return 301 /prometheus/;
    }

    location /prometheus/ {
        proxy_pass http://shide-prometheus:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }
}

# -----------------------------------------------------------
