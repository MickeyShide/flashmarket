# -----------------------------------------------------------
# MAIN GATEWAY SERVER (Path routing + Frontend)
# -----------------------------------------------------------
# All upstreams use variables so Nginx resolves them at
# request-time via the Docker DNS resolver.  This prevents
# crash-loops when a service container is not yet running.
# -----------------------------------------------------------

server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 ${GATEWAY_DOMAIN} _;
    server_tokens off;

    client_max_body_size 16k;

    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker internal DNS — enables dynamic upstream resolution
    # so nginx finds new containers without restart
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_redirect off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;


    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ---- Auth ----
    location /api/v1/auth {
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth;
    }

    location /api/v1/users {
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth;
    }

    location /api/v1/sessions {
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth;
    }

    location ^~ /api/v1/admin/drops {
        set $upstream_drops http://drops:8000;
        proxy_pass $upstream_drops;
    }

    location /api/v1/admin {
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth;
    }

    location /auth {
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth;
    }

    location /sessions {
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth;
    }

    location /users {
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth;
    }

    location /admin {
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth;
    }

    location /.well-known {
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth;
    }

    # ---- Catalog ----
    location /api/v1/products {
        set $upstream_catalog http://catalog:8000;
        proxy_pass $upstream_catalog;
    }

    location /api/v1/categories {
        set $upstream_catalog http://catalog:8000;
        proxy_pass $upstream_catalog;
    }

    location /api/v1/brands {
        set $upstream_catalog http://catalog:8000;
        proxy_pass $upstream_catalog;
    }

    # ---- Inventory ----
    location /api/v1/stocks {
        set $upstream_inventory http://inventory:8000;
        proxy_pass $upstream_inventory;
    }

    # ---- Orders ----
    location /api/v1/orders {
        set $upstream_orders http://orders:8000;
        proxy_pass $upstream_orders;
    }

    location /api/v1/promocodes {
        set $upstream_orders http://orders:8000;
        proxy_pass $upstream_orders;
    }

    # ---- Payments ----
    location /api/v1/payments {
        set $upstream_payments http://payments:8000;
        proxy_pass $upstream_payments;
    }

    # ---- Notifications ----
    location /api/v1/notifications {
        set $upstream_notifications http://notifications:8000;
        proxy_pass $upstream_notifications;
    }

    # ---- Wishlist ----
    location /api/v1/wishlist {
        set $upstream_wishlist http://wishlist:8000;
        proxy_pass $upstream_wishlist;
    }

    # ---- Drops ----
    location /api/v1/drops {
        set $upstream_drops http://drops:8000;
        proxy_pass $upstream_drops;
    }

    # ---- Frontend (catch-all) ----
    location / {
        set $upstream_frontend http://frontend:3000;
        proxy_pass $upstream_frontend;
    }

    # ---- Prometheus ----
    location /prometheus {
        return 301 /prometheus/;
    }

    location /prometheus/ {
        set $upstream_prometheus http://shide-prometheus:9090;
        proxy_pass $upstream_prometheus/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }
}

