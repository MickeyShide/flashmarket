# -----------------------------------------------------------
# MAIN GATEWAY SERVER (Path routing + Frontend)
# -----------------------------------------------------------
# All upstreams use variables so Nginx resolves them at
# request-time via the Docker DNS resolver.  This prevents
# crash-loops when a service container is not yet running.
#
# IMPORTANT: When proxy_pass uses a variable, Nginx does NOT
# auto-append the original URI.  We must add $request_uri
# explicitly to preserve the request path and query string.
# -----------------------------------------------------------

# Trusted proxy handling is shared by every virtual server so the same client
# address is used for forwarding and rate limiting on both the main domain and
# service subdomains.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Requests with an empty limit key are not accounted by Nginx. Keep probes and
# monitoring traffic independent from public API quotas.
map $uri $rate_limit_client_key {
    default                       $binary_remote_addr;
    ~^/health(?:/|$)              "";
    /metrics                      "";
    ~^/prometheus(?:/|$)          "";
    /nginx_status                 "";
}

limit_req_zone $rate_limit_client_key zone=auth_limit:10m rate=5r/s;
limit_req_zone $rate_limit_client_key zone=transaction_limit:10m rate=10r/s;
limit_req_zone $rate_limit_client_key zone=catalog_limit:10m rate=50r/s;
limit_req_zone $rate_limit_client_key zone=general_limit:10m rate=20r/s;

limit_req_status 429;
limit_req_log_level warn;
error_page 429 = @rate_limited;

server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 ${GATEWAY_DOMAIN} _;
    server_tokens off;

    client_max_body_size 16k;

    # Docker internal DNS — enables dynamic upstream resolution
    # so nginx finds new containers without restart
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_redirect off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;


    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ---- Auth ----
    location /api/v1/auth {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    location /api/v1/users {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    location /api/v1/sessions {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    location ^~ /api/v1/admin/drops {
        limit_req zone=catalog_limit burst=100 nodelay;
        set $upstream_drops http://drops:8000;
        proxy_pass $upstream_drops$request_uri;
    }

    location /api/v1/admin {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    location /auth {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    location /sessions {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    location /users {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    location /admin {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    location /.well-known {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream_auth http://auth:8000;
        proxy_pass $upstream_auth$request_uri;
    }

    # ---- Catalog ----
    location /api/v1/products {
        limit_req zone=catalog_limit burst=100 nodelay;
        set $upstream_catalog http://catalog:8000;
        proxy_pass $upstream_catalog$request_uri;
    }

    location /api/v1/categories {
        limit_req zone=catalog_limit burst=100 nodelay;
        set $upstream_catalog http://catalog:8000;
        proxy_pass $upstream_catalog$request_uri;
    }

    location /api/v1/brands {
        limit_req zone=catalog_limit burst=100 nodelay;
        set $upstream_catalog http://catalog:8000;
        proxy_pass $upstream_catalog$request_uri;
    }

    # ---- Inventory ----
    location /api/v1/stocks {
        limit_req zone=general_limit burst=40 nodelay;
        set $upstream_inventory http://inventory:8000;
        proxy_pass $upstream_inventory$request_uri;
    }

    # ---- Orders ----
    location /api/v1/orders {
        limit_req zone=transaction_limit burst=20 nodelay;
        set $upstream_orders http://orders:8000;
        proxy_pass $upstream_orders$request_uri;
    }

    location /api/v1/promocodes {
        limit_req zone=transaction_limit burst=20 nodelay;
        set $upstream_orders http://orders:8000;
        proxy_pass $upstream_orders$request_uri;
    }

    # ---- Payments ----
    location /api/v1/payments {
        limit_req zone=transaction_limit burst=20 nodelay;
        set $upstream_payments http://payments:8000;
        proxy_pass $upstream_payments$request_uri;
    }

    # ---- Notifications ----
    location /api/v1/notifications {
        limit_req zone=general_limit burst=40 nodelay;
        set $upstream_notifications http://notifications:8000;
        proxy_pass $upstream_notifications$request_uri;
    }

    # ---- Wishlist ----
    location /api/v1/wishlist {
        limit_req zone=transaction_limit burst=20 nodelay;
        set $upstream_wishlist http://wishlist:8000;
        proxy_pass $upstream_wishlist$request_uri;
    }

    # ---- Drops ----
    location /api/v1/drops {
        limit_req zone=catalog_limit burst=100 nodelay;
        set $upstream_drops http://drops:8000;
        proxy_pass $upstream_drops$request_uri;
    }

    # ---- Frontend (catch-all) ----
    location / {
        set $upstream_frontend http://frontend:3000;
        proxy_pass $upstream_frontend$request_uri;
    }

    # ---- Prometheus ----
    location /prometheus {
        return 301 /prometheus/;
    }

    location /prometheus/ {
        set $upstream_prometheus http://shide-prometheus:9090;
        rewrite ^/prometheus/(.*) /$1 break;
        proxy_pass $upstream_prometheus;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After "1" always;
        return 429 '{"error":{"code":"rate_limit_exceeded","message":"Too many requests"}}';
    }
}

