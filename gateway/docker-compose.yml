name: flashmarket-gateway

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    command: |
      /bin/sh -c "envsubst '\$API_DOMAIN' < /etc/nginx/conf.d/default.conf > /tmp/nginx.conf && \
        cp /tmp/nginx.conf /etc/nginx/conf.d/default.conf && \
        nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

networks:
  default:
    name: flashmarket
    external: true