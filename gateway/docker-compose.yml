name: flashmarket-gateway

services:
  nginx:
    image: nginx:alpine
    container_name: flashmarket-gateway
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-localhost}
      AUTH_PROXY_PORT: ${AUTH_PROXY_PORT:-4918}
      CATALOG_PROXY_PORT: ${CATALOG_PROXY_PORT:-4919}
      INVENTORY_PROXY_PORT: ${INVENTORY_PROXY_PORT:-4919}
      ORDERS_PROXY_PORT: ${ORDERS_PROXY_PORT:-4920}
      PAYMENTS_PROXY_PORT: ${PAYMENTS_PROXY_PORT:-4921}
      NOTIFICATIONS_PROXY_PORT: ${NOTIFICATIONS_PROXY_PORT:-4922}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    restart: unless-stopped
    networks:
      - default

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: flashmarket-nginx-exporter
    command: ["--nginx.scrape-uri=http://flashmarket-gateway/nginx_status"]
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped
    networks:
      - default