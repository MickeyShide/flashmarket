name: flashmarket-gateway

services:
  nginx:
    image: nginx:alpine
    container_name: flashmarket-gateway
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
      - "127.0.0.1:${MEDIA_STORAGE_PORT:-9000}:9000"
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-localhost}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    restart: unless-stopped
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-64m}
    mem_reservation: ${GATEWAY_MEMORY_RESERVATION:-16m}
    pids_limit: ${GATEWAY_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 10s
    logging: &bounded-logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    networks:
      - shide-observability

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: flashmarket-nginx-exporter
    command: ["--nginx.scrape-uri=http://flashmarket-gateway/nginx_status"]
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped
    mem_limit: ${GATEWAY_EXPORTER_MEMORY_LIMIT:-48m}
    mem_reservation: ${GATEWAY_EXPORTER_MEMORY_RESERVATION:-12m}
    pids_limit: ${GATEWAY_EXPORTER_PIDS_LIMIT:-32}
    init: true
    stop_grace_period: 10s
    logging: *bounded-logging
    networks:
      - shide-observability

networks:
  shide-observability:
    external: true
    name: shide-observability
