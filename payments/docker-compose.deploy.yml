name: flashmarket-payments

x-payments-runtime: &payments-runtime
  image: ${PAYMENTS_IMAGE:-flashmarket-payments-api:local}
  pull_policy: always
  env_file:
    - ${PAYMENTS_ENV_FILE:-.env}
  networks:
    - backend

x-payments-environment: &payments-environment
  PAYMENTS_ENVIRONMENT: ${PAYMENTS_ENVIRONMENT:-production}
  PAYMENTS_DATABASE_URL: ${PAYMENTS_DATABASE_URL}
  PAYMENTS_RABBITMQ_URL: ${PAYMENTS_RABBITMQ_URL}
  PAYMENTS_CORS_ORIGINS: ${PAYMENTS_CORS_ORIGINS:-[]}
  PAYMENTS_TRUSTED_HOSTS: ${PAYMENTS_TRUSTED_HOSTS}
  PAYMENTS_DOCS_ENABLED: ${PAYMENTS_DOCS_ENABLED:-false}
  PAYMENTS_DEBUG: ${PAYMENTS_DEBUG:-false}
  PAYMENTS_ALLOW_INSECURE_INTERNAL_SERVICES: ${PAYMENTS_ALLOW_INSECURE_INTERNAL_SERVICES:-false}

services:
  migrate:
    <<: *payments-runtime
    environment:
      PAYMENTS_ENVIRONMENT: development
      PAYMENTS_DATABASE_URL: ${PAYMENTS_DATABASE_URL}
    command: [".venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *payments-runtime
    environment: *payments-environment
    ports:
      - "127.0.0.1:${PAYMENTS_PROXY_PORT:-4922}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  consumer:
    <<: *payments-runtime
    environment: *payments-environment
    command: [".venv/bin/python", "-m", "payments.event_consumer"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  outbox:
    <<: *payments-runtime
    environment: *payments-environment
    command: [".venv/bin/python", "-m", "payments.outbox_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payments}
      POSTGRES_USER: ${POSTGRES_USER:-flashmarket_payments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - payments-postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-flashmarket_payments}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - payments-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    env_file:
      - ${PAYMENTS_ENV_FILE:-.env}
    ports:
      - "${PAYMENTS_PROXY_PORT:-4922}:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - frontend
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          --header="Host: $${PAYMENTS_DOMAIN}"
          http://127.0.0.1/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true

volumes:
  payments-postgres-data:
  payments-rabbitmq-data:
