name: flashmarket-payments

x-payments-runtime: &payments-runtime
  image: ${PAYMENTS_IMAGE:-flashmarket-payments-api:local}
  pull_policy: always
  env_file:
    - ${PAYMENTS_ENV_FILE:-.env}
  networks:
    backend:
      aliases:
        - payments

x-payments-environment: &payments-environment
  PAYMENTS_ENVIRONMENT: ${PAYMENTS_ENVIRONMENT:-production}
  PAYMENTS_DATABASE_URL: ${PAYMENTS_DATABASE_URL}
  PAYMENTS_RABBITMQ_URL: ${PAYMENTS_RABBITMQ_URL}
  PAYMENTS_CORS_ORIGINS: ${PAYMENTS_CORS_ORIGINS:-[]}
  PAYMENTS_TRUSTED_HOSTS: ${PAYMENTS_TRUSTED_HOSTS}
  PAYMENTS_DOCS_ENABLED: ${PAYMENTS_DOCS_ENABLED:-false}
  PAYMENTS_DEBUG: ${PAYMENTS_DEBUG:-false}
  PAYMENTS_ALLOW_INSECURE_INTERNAL_SERVICES: ${PAYMENTS_ALLOW_INSECURE_INTERNAL_SERVICES:-false}
  PAYMENTS_JWT_PUBLIC_KEY_DIR: /var/lib/flashmarket/keys/public
  PAYMENTS_JWT_ALGORITHM: EdDSA
  PAYMENTS_JWT_ISSUER: flashmarket-auth
  PAYMENTS_JWT_AUDIENCE: flashmarket-api

services:
  api:
    <<: *payments-runtime
    mem_limit: ${PAYMENTS_API_MEMORY_LIMIT:-256m}
    mem_reservation: ${PAYMENTS_API_MEMORY_RESERVATION:-96m}
    pids_limit: ${PAYMENTS_API_PIDS_LIMIT:-128}
    init: true
    stop_grace_period: 20s
    logging: &bounded-logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    environment: *payments-environment
    volumes:
      - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro
    depends_on: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  consumer:
    <<: *payments-runtime
    mem_limit: ${PAYMENTS_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${PAYMENTS_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${PAYMENTS_WORKER_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 20s
    logging: *bounded-logging
    environment: *payments-environment
    command:
      - consumer
      - payments.event_consumer
    depends_on: {}
    restart: unless-stopped
    healthcheck: &worker-health
      test: ["CMD", "python", "-m", "rabbitmq_reliability.heartbeat", "/tmp/flashmarket-heartbeat.json", "45"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 45s

  outbox:
    <<: *payments-runtime
    mem_limit: ${PAYMENTS_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${PAYMENTS_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${PAYMENTS_WORKER_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 20s
    logging: *bounded-logging
    environment: *payments-environment
    command:
      - outbox
      - payments.outbox_worker
    depends_on: {}
    restart: unless-stopped
    healthcheck: *worker-health

  nginx:
    image: nginx:1.30-alpine
    env_file:
      - ${PAYMENTS_ENV_FILE:-.env}
    ports:
      - "${PAYMENTS_PROXY_PORT:-4921}:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - frontend
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    mem_limit: ${PAYMENTS_NGINX_MEMORY_LIMIT:-32m}
    mem_reservation: ${PAYMENTS_NGINX_MEMORY_RESERVATION:-8m}
    pids_limit: ${PAYMENTS_NGINX_PIDS_LIMIT:-32}
    init: true
    stop_grace_period: 10s
    logging: *bounded-logging

networks:
  frontend:
    external: true
    name: shide-observability
  backend:
    external: true
    name: shide-observability

volumes:
  auth-jwt-keys-public:
    external: true
    name: flashmarket-auth-jwt-keys-public
