name: flashmarket-payments

x-payments-runtime: &payments-runtime
  image: flashmarket-payments-api:local
  pull_policy: never
  init: true
  stop_grace_period: 20s
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

x-payments-environment: &payments-environment
  PAYMENTS_ENVIRONMENT: development
  PAYMENTS_DATABASE_URL: postgresql+asyncpg://${INFRA_USER:-shide}:${POSTGRES_PASSWORD:-shide}@shide-postgres:5432/payments
  PAYMENTS_RABBITMQ_URL: amqp://${INFRA_USER:-shide}:${RABBITMQ_PASSWORD:-shide}@shide-rabbitmq:5672/flashmarket
  PAYMENTS_CORS_ORIGINS: '["http://localhost:3000"]'
  PAYMENTS_TRUSTED_HOSTS: '["localhost","127.0.0.1","payments","gateway"]'
  PAYMENTS_LOG_FILE_PATH: /var/log/shide/payments-api.log
  PAYMENTS_ALLOW_INSECURE_INTERNAL_SERVICES: 'true'
  PAYMENTS_JWT_PUBLIC_KEY_DIR: /var/lib/flashmarket/keys/public
  PAYMENTS_JWT_ALGORITHM: EdDSA
  PAYMENTS_JWT_ISSUER: flashmarket-auth
  PAYMENTS_JWT_AUDIENCE: flashmarket-api

services:
  api:
    <<: *payments-runtime
    build:
      context: ..
      dockerfile: payments/Dockerfile
    environment: *payments-environment
    ports:
      - "127.0.0.1:${PAYMENTS_PORT:-4921}:8000"
    volumes:
      - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro
      - backend-logs-local:/var/log/shide
      - payments-metrics-data:/tmp/prometheus
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    mem_limit: ${PAYMENTS_API_MEMORY_LIMIT:-256m}
    mem_reservation: ${PAYMENTS_API_MEMORY_RESERVATION:-96m}
    pids_limit: ${PAYMENTS_API_PIDS_LIMIT:-128}

  consumer:
    <<: *payments-runtime
    environment:
      <<: *payments-environment
      PAYMENTS_LOG_FILE_PATH: /var/log/shide/payments-consumer.log
    command:
      - consumer
      - payments.event_consumer
    volumes:
      - backend-logs-local:/var/log/shide
    restart: unless-stopped
    mem_limit: ${PAYMENTS_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${PAYMENTS_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${PAYMENTS_WORKER_PIDS_LIMIT:-64}

  outbox:
    <<: *payments-runtime
    environment:
      <<: *payments-environment
      PAYMENTS_LOG_FILE_PATH: /var/log/shide/payments-outbox.log
    command:
      - outbox
      - payments.outbox_worker
    volumes:
      - backend-logs-local:/var/log/shide
    restart: unless-stopped
    mem_limit: ${PAYMENTS_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${PAYMENTS_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${PAYMENTS_WORKER_PIDS_LIMIT:-64}

volumes:
  payments-metrics-data:
  backend-logs-local:
    external: true
    name: shide-backend-logs-local

networks:
  default:
    name: shide-observability
    external: true
