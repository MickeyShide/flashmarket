name: flashmarket-payments

x-payments-runtime: &payments-runtime
  image: flashmarket-payments-api:local
  pull_policy: never

x-payments-environment: &payments-environment
  PAYMENTS_ENVIRONMENT: development
  PAYMENTS_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@db:5432/payments
  PAYMENTS_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  PAYMENTS_CORS_ORIGINS: '["http://localhost:3000"]'

services:
  migrate:
    <<: *payments-runtime
    environment:
      PAYMENTS_ENVIRONMENT: development
      PAYMENTS_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@db:5432/payments
    command: [".venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *payments-runtime
    build:
      context: .
    environment: *payments-environment
    ports:
      - "127.0.0.1:${PAYMENTS_PORT:-8014}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  consumer:
    <<: *payments-runtime
    environment: *payments-environment
    command: [".venv/bin/python", "-m", "payments.event_consumer"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  outbox:
    <<: *payments-runtime
    environment: *payments-environment
    command: [".venv/bin/python", "-m", "payments.outbox_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: flashmarket
      POSTGRES_PASSWORD: flashmarket
    ports:
      - "127.0.0.1:${PAYMENTS_DB_PORT:-5436}:5432"
    volumes:
      - payments-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashmarket -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    # Internal RabbitMQ reachable only via the Docker network to avoid port
    # conflicts with other service brokers in the root compose stack.
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  payments-postgres-data:

networks:
  default:
    name: flashmarket
    external: true
