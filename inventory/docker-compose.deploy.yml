name: flashmarket-inventory

x-inventory-runtime: &inventory-runtime
  image: ${INVENTORY_IMAGE:-flashmarket-inventory-api:local}
  pull_policy: always
  env_file:
    - ${INVENTORY_ENV_FILE:-.env}
  networks:
    backend:
      aliases:
        - inventory

x-inventory-environment: &inventory-environment
  INVENTORY_ENVIRONMENT: ${INVENTORY_ENVIRONMENT:-production}
  INVENTORY_DATABASE_URL: ${INVENTORY_DATABASE_URL}
  INVENTORY_REDIS_URL: ${INVENTORY_REDIS_URL}
  INVENTORY_STOCK_CACHE_TTL_SECONDS: ${INVENTORY_STOCK_CACHE_TTL_SECONDS:-30}
  INVENTORY_RABBITMQ_URL: ${INVENTORY_RABBITMQ_URL}
  INVENTORY_RESERVATION_TTL_SECONDS: ${INVENTORY_RESERVATION_TTL_SECONDS:-300}
  INVENTORY_DROPS_BASE_URL: ${INVENTORY_DROPS_BASE_URL:-http://drops:8000}
  INVENTORY_EXPIRY_POLL_INTERVAL_SECONDS: ${INVENTORY_EXPIRY_POLL_INTERVAL_SECONDS:-5}
  INVENTORY_CORS_ORIGINS: ${INVENTORY_CORS_ORIGINS:-[]}
  INVENTORY_TRUSTED_HOSTS: ${INVENTORY_TRUSTED_HOSTS}
  INVENTORY_DOCS_ENABLED: ${INVENTORY_DOCS_ENABLED:-false}
  INVENTORY_DEBUG: ${INVENTORY_DEBUG:-false}
  INVENTORY_ALLOW_INSECURE_INTERNAL_SERVICES: ${INVENTORY_ALLOW_INSECURE_INTERNAL_SERVICES:-false}
  INVENTORY_JWT_PUBLIC_KEY_DIR: /var/lib/flashmarket/keys/public
  INVENTORY_JWT_ALGORITHM: EdDSA
  INVENTORY_JWT_ISSUER: flashmarket-auth
  INVENTORY_JWT_AUDIENCE: flashmarket-api

services:
  api:
    <<: *inventory-runtime
    mem_limit: ${INVENTORY_API_MEMORY_LIMIT:-256m}
    mem_reservation: ${INVENTORY_API_MEMORY_RESERVATION:-96m}
    pids_limit: ${INVENTORY_API_PIDS_LIMIT:-128}
    init: true
    stop_grace_period: 20s
    logging: &bounded-logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    environment: *inventory-environment
    volumes:
      - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro
    depends_on: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  consumer:
    <<: *inventory-runtime
    mem_limit: ${INVENTORY_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${INVENTORY_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${INVENTORY_WORKER_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 20s
    logging: *bounded-logging
    networks:
      backend:
        aliases: [inventory-consumer]
    environment: *inventory-environment
    command:
      - consumer
      - inventory.event_consumer
    depends_on: {}
    restart: unless-stopped
    labels:
      flashmarket.autoheal: "true"
    healthcheck: &worker-health
      test: ["CMD-SHELL", "python -m rabbitmq_reliability.heartbeat /tmp/flashmarket-heartbeat.json $${INVENTORY_WORKER_HEARTBEAT_STALE_SECONDS:-45}"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 45s

  outbox:
    <<: *inventory-runtime
    mem_limit: ${INVENTORY_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${INVENTORY_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${INVENTORY_WORKER_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 20s
    logging: *bounded-logging
    networks:
      backend:
        aliases: [inventory-outbox]
    environment: *inventory-environment
    command:
      - outbox
      - inventory.outbox_worker
    depends_on: {}
    restart: unless-stopped
    labels:
      flashmarket.autoheal: "true"
    healthcheck: *worker-health

  expiry:
    <<: *inventory-runtime
    mem_limit: ${INVENTORY_MAINTENANCE_MEMORY_LIMIT:-128m}
    mem_reservation: ${INVENTORY_MAINTENANCE_MEMORY_RESERVATION:-40m}
    pids_limit: ${INVENTORY_MAINTENANCE_PIDS_LIMIT:-64}
    init: true
    stop_grace_period: 20s
    logging: *bounded-logging
    networks:
      backend:
        aliases: [inventory-expiry]
    environment: *inventory-environment
    command:
      - cleanup
      - python
      - -m
      - inventory.expiry_worker
    depends_on: {}
    restart: unless-stopped
    labels:
      flashmarket.autoheal: "true"
    healthcheck: *worker-health

  nginx:
    image: nginx:1.30-alpine
    env_file:
      - ${INVENTORY_ENV_FILE:-.env}
    ports:
      - "${INVENTORY_PROXY_PORT:-4923}:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - frontend
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    mem_limit: ${INVENTORY_NGINX_MEMORY_LIMIT:-32m}
    mem_reservation: ${INVENTORY_NGINX_MEMORY_RESERVATION:-8m}
    pids_limit: ${INVENTORY_NGINX_PIDS_LIMIT:-32}
    init: true
    stop_grace_period: 10s
    logging: *bounded-logging

networks:
  frontend:
    external: true
    name: shide-observability
  backend:
    external: true
    name: shide-observability

volumes:
  auth-jwt-keys-public:
    external: true
    name: flashmarket-auth-jwt-keys-public
