name: flashmarket-inventory

x-inventory-runtime: &inventory-runtime
  image: flashmarket-inventory-api:local
  pull_policy: never

x-inventory-environment: &inventory-environment
  INVENTORY_ENVIRONMENT: development
  INVENTORY_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@db:5432/inventory
  INVENTORY_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  INVENTORY_CORS_ORIGINS: '["http://localhost:3000"]'

services:
  migrate:
    <<: *inventory-runtime
    environment:
      INVENTORY_ENVIRONMENT: development
      INVENTORY_DATABASE_URL: postgresql+asyncpg://flashmarket:flashmarket@db:5432/inventory
    command: [".venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *inventory-runtime
    build:
      context: .
    environment: *inventory-environment
    ports:
      - "127.0.0.1:${INVENTORY_PORT:-8011}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  outbox:
    <<: *inventory-runtime
    environment: *inventory-environment
    command: [".venv/bin/python", "-m", "inventory.outbox_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: flashmarket
      POSTGRES_PASSWORD: flashmarket
    ports:
      - "127.0.0.1:${INVENTORY_DB_PORT:-5434}:5432"
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashmarket -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  inventory-postgres-data:

networks:
  default:
    name: flashmarket
    external: true
