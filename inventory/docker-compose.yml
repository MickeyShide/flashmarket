name: flashmarket-inventory

x-inventory-runtime: &inventory-runtime
  image: flashmarket-inventory-api:local
  pull_policy: never

x-inventory-environment: &inventory-environment
  INVENTORY_ENVIRONMENT: development
  INVENTORY_DATABASE_URL: postgresql+asyncpg://${INFRA_USER:-shide}:${POSTGRES_PASSWORD:-shide}@shide-postgres:5432/inventory
  INVENTORY_RABBITMQ_URL: amqp://${INFRA_USER:-shide}:${RABBITMQ_PASSWORD:-shide}@shide-rabbitmq:5672//inventory
  INVENTORY_CORS_ORIGINS: '["http://localhost:3000"]'
  INVENTORY_LOG_FILE_PATH: /var/log/shide/inventory-api.log
  INVENTORY_PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
  INVENTORY_ALLOW_INSECURE_INTERNAL_SERVICES: 'true'

services:
  api:
    <<: *inventory-runtime
    build:
      context: .
    environment: *inventory-environment
    ports:
      - "127.0.0.1:${INVENTORY_PORT:-4919}:8000"
    volumes:
      - backend-logs-local:/var/log/shide
      - inventory-metrics-data:/tmp/prometheus
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  consumer:
    <<: *inventory-runtime
    environment:
      <<: *inventory-environment
      INVENTORY_LOG_FILE_PATH: /var/log/shide/inventory-consumer.log
    command:
      - consumer
      - inventory.event_consumer
    volumes:
      - backend-logs-local:/var/log/shide
    restart: unless-stopped

  outbox:
    <<: *inventory-runtime
    environment:
      <<: *inventory-environment
      INVENTORY_LOG_FILE_PATH: /var/log/shide/inventory-outbox.log
    command:
      - outbox
      - inventory.outbox_worker
    volumes:
      - backend-logs-local:/var/log/shide
    restart: unless-stopped

volumes:
  inventory-metrics-data:
  backend-logs-local:
    external: true
    name: shide-backend-logs-local

networks:
  default:
    name: shide-observability
    external: true