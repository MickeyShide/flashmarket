name: flashmarket-inventory

x-inventory-runtime: &inventory-runtime
  image: flashmarket-inventory-api:local
  pull_policy: never
  init: true
  stop_grace_period: 20s
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

x-inventory-environment: &inventory-environment
  INVENTORY_ENVIRONMENT: development
  INVENTORY_DATABASE_URL: postgresql+asyncpg://${INFRA_USER:-shide}:${POSTGRES_PASSWORD:-shide}@shide-postgres:5432/inventory
  INVENTORY_REDIS_URL: redis://shide-redis:6379/2
  INVENTORY_STOCK_CACHE_TTL_SECONDS: 30
  INVENTORY_RABBITMQ_URL: amqp://${INFRA_USER:-shide}:${RABBITMQ_PASSWORD:-shide}@shide-rabbitmq:5672/flashmarket
  INVENTORY_DROPS_BASE_URL: http://drops:8000
  INVENTORY_EXPIRY_POLL_INTERVAL_SECONDS: 5
  INVENTORY_CORS_ORIGINS: '["http://localhost:3000"]'
  INVENTORY_TRUSTED_HOSTS: '["localhost","127.0.0.1","inventory","gateway"]'
  INVENTORY_LOG_FILE_PATH: /var/log/shide/inventory-api.log
  INVENTORY_ALLOW_INSECURE_INTERNAL_SERVICES: 'true'
  INVENTORY_JWT_PUBLIC_KEY_DIR: /var/lib/flashmarket/keys/public
  INVENTORY_JWT_ALGORITHM: EdDSA
  INVENTORY_JWT_ISSUER: flashmarket-auth
  INVENTORY_JWT_AUDIENCE: flashmarket-api

services:
  api:
    <<: *inventory-runtime
    build:
      context: ..
      dockerfile: inventory/Dockerfile
    environment: *inventory-environment
    ports:
      - "127.0.0.1:${INVENTORY_PORT:-4923}:8000"
    volumes:
      - auth-jwt-keys-public:/var/lib/flashmarket/keys/public:ro
      - backend-logs-local:/var/log/shide
      - inventory-metrics-data:/tmp/prometheus
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    mem_limit: ${INVENTORY_API_MEMORY_LIMIT:-256m}
    mem_reservation: ${INVENTORY_API_MEMORY_RESERVATION:-96m}
    pids_limit: ${INVENTORY_API_PIDS_LIMIT:-128}

  consumer:
    <<: *inventory-runtime
    environment:
      <<: *inventory-environment
      INVENTORY_LOG_FILE_PATH: /var/log/shide/inventory-consumer.log
    command:
      - consumer
      - inventory.event_consumer
    volumes:
      - backend-logs-local:/var/log/shide
    restart: unless-stopped
    mem_limit: ${INVENTORY_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${INVENTORY_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${INVENTORY_WORKER_PIDS_LIMIT:-64}

  outbox:
    <<: *inventory-runtime
    environment:
      <<: *inventory-environment
      INVENTORY_LOG_FILE_PATH: /var/log/shide/inventory-outbox.log
    command:
      - outbox
      - inventory.outbox_worker
    volumes:
      - backend-logs-local:/var/log/shide
    restart: unless-stopped
    mem_limit: ${INVENTORY_WORKER_MEMORY_LIMIT:-160m}
    mem_reservation: ${INVENTORY_WORKER_MEMORY_RESERVATION:-56m}
    pids_limit: ${INVENTORY_WORKER_PIDS_LIMIT:-64}

  expiry:
    <<: *inventory-runtime
    environment:
      <<: *inventory-environment
      INVENTORY_LOG_FILE_PATH: /var/log/shide/inventory-expiry.log
    command:
      - cleanup
      - python
      - -m
      - inventory.expiry_worker
    volumes:
      - backend-logs-local:/var/log/shide
    restart: unless-stopped
    mem_limit: ${INVENTORY_MAINTENANCE_MEMORY_LIMIT:-128m}
    mem_reservation: ${INVENTORY_MAINTENANCE_MEMORY_RESERVATION:-40m}
    pids_limit: ${INVENTORY_MAINTENANCE_PIDS_LIMIT:-64}

volumes:
  inventory-metrics-data:
  backend-logs-local:
    external: true
    name: shide-backend-logs-local

networks:
  default:
    name: shide-observability
    external: true
